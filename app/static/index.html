<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlopClanker</title>
<style>
:root{--bg:#0f1317;--pan:#161c22;--pan2:#1d252d;--pan3:#242e38;--fg:#e3e9ef;--dim:#8a98a5;
--acc:#4fb6ff;--ok:#5ad4a0;--warn:#ffb454;--bad:#ff6b7a;--line:#28313a;--line2:#323d48;
--idea:#98a7b5;--plan:#4fb6ff;--proposed:#c792ea;--approved:#5ad4a0;
--building:#ffb454;--review:#ffd866;--done:#5ad4a0;--paused:#7f8fa0;--trashed:#ff6b7a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:0 0 8px}
header{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--pan);
border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6;flex-wrap:wrap}
header .logo{font-weight:700;letter-spacing:.4px;margin-right:4px;white-space:nowrap}
header select{max-width:220px;background:var(--pan2);border:1px solid var(--line);color:var(--fg);
border-radius:6px;padding:4px 6px;font:inherit}
nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
nav a{padding:5px 10px;border-radius:6px;color:var(--dim);white-space:nowrap}
nav a.on{background:var(--pan3);color:var(--fg)}
main{padding:20px;max-width:1280px;margin:0 auto}
button{background:var(--pan2);color:var(--fg);border:1px solid var(--line2);border-radius:6px;
padding:5px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#08222f;border-color:var(--acc);font-weight:600}
button.bad{color:var(--bad);border-color:#5c2a32}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{border-color:var(--line2)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--pan2);border:1px solid var(--line);color:var(--fg);
border-radius:6px;padding:6px 9px;font:inherit}
textarea{width:100%;min-height:70px;resize:vertical}
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grid{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dim{color:var(--dim)}.small{font-size:12px}.mono{font-family:ui-monospace,monospace}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.t-idea{background:#2a333c}.t-plan{background:#123a55}.t-proposed{background:#3a2a55}
.t-approved{background:#14452f}.t-building{background:#553d1a}.t-review{background:#554a1a}
.t-done{background:#14452f}.t-paused{background:#333d49}.t-trashed{background:#55232b}
.t-high{background:#553d1a}.t-urgent{background:#55232b}
.st-idea{color:var(--idea)}.st-plan{color:var(--plan)}.st-proposed{color:var(--proposed)}
.st-approved{color:var(--approved)}.st-building{color:var(--building)}
.st-review{color:var(--review)}.st-done{color:var(--done)}
.st-paused{color:var(--paused)}.st-trashed{color:var(--trashed)}
.badge{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700}
.badge.blue{background:var(--acc);color:#08222f}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-size:12px;font-weight:600}
.comment{border-left:3px solid var(--line);padding:6px 12px;margin:8px 0}
.comment.trashed{opacity:.55;border-left-color:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(4,8,12,.72);display:flex;
align-items:flex-start;justify-content:center;z-index:20;padding:6vh 12px}
.modal{background:var(--pan);border:1px solid var(--line2);border-radius:12px;
padding:18px 20px;width:min(620px,94vw);max-height:84vh;overflow:auto}
.modal label{display:block;margin:10px 0 3px;color:var(--dim);font-size:12px}
.bigtitle{font-size:17px;font-weight:600;min-height:2.4em;resize:none;line-height:1.35}
.bell{position:relative}
.bell .badge{position:absolute;top:-6px;right:-8px;cursor:pointer}
.bell-drop{position:absolute;right:0;top:36px;width:380px;max-height:60vh;overflow:auto;
background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px;z-index:10}
.notif{padding:7px 9px;border-bottom:1px solid var(--line);cursor:default}
.qopen{background:#3a2a55}
.frozen{outline:2px dashed var(--proposed);outline-offset:2px}
.check{width:16px;height:16px;accent-color:var(--acc)}
#toast{position:fixed;bottom:18px;right:18px;z-index:50;display:grid;gap:8px}
.tst{background:var(--pan3);border:1px solid var(--line2);border-radius:8px;
padding:9px 14px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.tst.err{border-color:var(--bad)}
.md p{margin:6px 0}.md code{background:var(--pan2);padding:1px 5px;border-radius:4px;
font-family:ui-monospace,monospace;font-size:12.5px}
.md pre{background:var(--pan2);padding:10px;border-radius:8px;overflow:auto}
.md ul{margin:6px 0;padding-left:22px}
/* page head + crumb */
.crumb{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12.5px;margin-bottom:4px}
.crumb a{color:var(--dim)}.crumb a:hover{color:var(--acc)}
.typelabel{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--dim)}
.pagehead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;
margin-bottom:14px;flex-wrap:wrap}
.pagehead .statusline{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
.bigstate{font-size:12px;font-weight:700;padding:3px 10px;border-radius:11px}
/* tabs (github-like) */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 16px;flex-wrap:wrap}
.tabs a{padding:8px 14px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
.tabs .cnt{background:var(--pan3);border-radius:9px;padding:0 7px;font-size:11px;margin-left:5px}
/* kanban */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.kcol{min-width:210px;max-width:280px;flex:1 0 210px;background:var(--pan);
border:1px solid var(--line);border-radius:10px;padding:8px}
.kcol h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
display:flex;justify-content:space-between;align-items:center}
.kcol .cnt{background:var(--pan3);border-radius:9px;padding:0 7px;font-size:11px}
.kcard{background:var(--pan2);border:1px solid transparent;border-radius:8px;padding:8px 10px;
margin-bottom:7px;cursor:pointer}
.kcard:hover{border-color:var(--acc)}
.kcard .kt{font-weight:600;line-height:1.35;margin-bottom:5px;word-break:break-word}
.kcard .kmeta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--dim)}
.avatar{display:inline-flex;width:19px;height:19px;border-radius:50%;background:var(--pan3);
align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:var(--fg)}
/* state stepper */
.stepper{display:flex;gap:0;align-items:center;flex-wrap:wrap;margin:2px 0}
.stepper .step{font-size:11px;color:var(--dim);padding:2px 8px;border-radius:9px;background:var(--pan2)}
.stepper .step.done{color:var(--ok)}
.stepper .step.cur{color:#08222f;background:var(--acc);font-weight:700}
.stepper .sep{color:var(--line2);margin:0 2px}
/* tag chips input */
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:5px;border:1px solid var(--line);
border-radius:6px;background:var(--pan2);position:relative}
.chips .chip{background:var(--pan3);border-radius:10px;padding:2px 8px;font-size:12px;
display:inline-flex;gap:5px;align-items:center}
.chips .chip b{cursor:pointer;color:var(--dim);font-weight:400}
.chips input{background:transparent;border:none;padding:3px;flex:1;min-width:90px}
.chipdrop{position:relative}
.chipmenu{position:absolute;left:0;right:0;top:100%;background:var(--pan3);
border:1px solid var(--line2);border-radius:8px;z-index:30;margin-top:3px;overflow:hidden}
.chipmenu div{padding:6px 10px;cursor:pointer;font-size:12.5px}
.chipmenu div:hover,.chipmenu div.sel{background:var(--pan2)}
/* attention */
.attrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
padding:9px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.empty{padding:26px 10px;text-align:center;color:var(--dim)}
.empty .big{font-size:15px;margin-bottom:4px}
</style>
</head>
<body>
<header>
  <span class="logo">&#9879; SlopClanker</span>
  <select id="sel-stack" style="display:none" title="stack"></select>
  <select id="sel-project" style="display:none" title="project"></select>
  <button class="ghost" id="star" style="display:none" title="make this stack the default">&#9734;</button>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <span id="me" class="dim small"></span>
  <div class="bell" id="bell" style="display:none">
    <button class="ghost" id="bellbtn">&#128276;</button>
    <span class="badge" id="bellcount" style="display:none"></span>
    <div class="bell-drop" id="belldrop" style="display:none"></div>
  </div>
  <button class="ghost" id="logout" style="display:none">logout</button>
</header>
<main id="main"><p class="dim">loading…</p></main>
<div id="toast"></div>
<script>
"use strict";
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
let TOKEN = localStorage.getItem("sk_token") || "";
let ME = null;

function toast(msg, err) {
  const d = document.createElement("div");
  d.className = "tst" + (err ? " err" : "");
  d.textContent = msg;
  $("#toast").appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function md(src) {
  let t = esc(src || "");
  t = t.replace(/```([\s\S]*?)```/g, (_, c) => "<pre>" + c.trim() + "</pre>");
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/^###? (.+)$/gm, "<strong>$1</strong>");
  t = t.replace(/^- (.+)$/gm, "<li>$1</li>");
  t = t.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>");
  return t.split(/\n{2,}/).map(p =>
    /^<(ul|pre|strong)/.test(p) ? p : "<p>" + p.replace(/\n/g, "<br>") + "</p>"
  ).join("");
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (TOKEN) opt.headers.Authorization = "Bearer " + TOKEN;
  if (body !== undefined) opt.headers["Content-Type"] = "application/json";
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  if (r.status === 401 && TOKEN) { logoutLocal(); throw new Error("session expired"); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
  return data;
}

function logoutLocal() { TOKEN = ""; ME = null; localStorage.removeItem("sk_token"); route(); }

/* ---- SSE: one multiplexed stream, since-cursor reconnect, poll fallback */
const SSE = { ctrl: null, since: 0, handlers: new Set(), fails: 0, timer: null };

function sse_on(fn) { SSE.handlers.add(fn); return () => SSE.handlers.delete(fn); }

function sse_start() {
  sse_stop();
  if (!TOKEN) return;
  SSE.timer = setTimeout(sse_poll_fallback, 15000);
  (async () => {
    const ctl = new AbortController();
    SSE.ctrl = ctl;
    try {
      const r = await fetch("/api/stream?since=" + SSE.since, {
        headers: { Authorization: "Bearer " + TOKEN }, signal: ctl.signal });
      if (!r.ok || !r.body) throw new Error("stream " + r.status);
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          for (const line of frame.split("\n")) {
            if (line.startsWith("id: ")) SSE.since = parseInt(line.slice(4)) || SSE.since;
            if (line.startsWith("data: ")) {
              SSE.fails = 0; clearTimeout(SSE.timer);
              SSE.timer = setTimeout(sse_poll_fallback, 30000);
              let ev = null;
              try { ev = JSON.parse(line.slice(6)); } catch { }
              if (ev) SSE.handlers.forEach(fn => { try { fn(ev); } catch { } });
            }
          }
        }
      }
    } catch { /* aborted or dropped */ }
    if (SSE.ctrl === ctl && TOKEN) {
      SSE.fails++;
      setTimeout(sse_start, Math.min(1000 * SSE.fails, 10000));
    }
  })();
}

function sse_stop() {
  if (SSE.ctrl) { SSE.ctrl.abort(); SSE.ctrl = null; }
  clearTimeout(SSE.timer);
}

async function sse_poll_fallback() {
  if (!TOKEN) return;
  try {
    const evs = await api("GET", "/api/events?since=" + SSE.since + "&limit=100");
    for (const ev of evs) { SSE.since = Math.max(SSE.since, ev.id); SSE.handlers.forEach(fn => fn(ev)); }
  } catch { }
  SSE.timer = setTimeout(sse_poll_fallback, 8000);
}

/* ---- router */
const ROUTES = [];
function route() {
  const h = location.hash || "#/";
  if (!TOKEN) return render_auth();
  const parts = h.slice(2).split("/");
  const name = parts[0] || "home";
  const fn = ROUTES.find(r => r.name === name);
  (fn ? fn.view : view_home)(parts.slice(1));
}
window.addEventListener("hashchange", () => route());

/* ================= auth (setup wizard / login) ================= */
async function render_auth() {
  sse_stop();
  $("#nav").innerHTML = ""; $("#me").textContent = ""; $("#bell").style.display = "none";
  $("#logout").style.display = "none";
  $("#sel-stack").style.display = "none"; $("#sel-project").style.display = "none";
  $("#star").style.display = "none";
  let st = {};
  try { st = await api("GET", "/api/setup"); } catch { }
  if (st.setup_required) {
    $("#main").innerHTML = `
      <div class="card" style="max-width:420px;margin:8vh auto">
        <h2 style="margin-top:0">First-time setup</h2>
        <p class="dim">Create the superadmin account. This screen never appears again.</p>
        <div class="grid">
          <input id="su-name" placeholder="admin username" autocomplete="username">
          <input id="su-pass" type="password" placeholder="password (min 10 chars)"
                 autocomplete="new-password">
          <button class="pri" id="su-go">Create &amp; sign in</button>
        </div>
      </div>`;
    $("#su-go").onclick = async () => {
      try {
        await api("POST", "/api/setup", {
          username: $("#su-name").value.trim(),
          password: $("#su-pass").value });
        toast("superadmin created");
        await do_login($("#su-name").value.trim(), $("#su-pass").value);
      } catch (e) { toast(e.message, true); }
    };
    return;
  }
  $("#main").innerHTML = `
    <div class="card" style="max-width:420px;margin:8vh auto">
      <h2 style="margin-top:0">&#9879; SlopClanker</h2>
      <p class="dim">Sign in for humans. Clankers enroll through their agents.</p>
      <div class="grid">
        <input id="li-name" placeholder="username" autocomplete="username">
        <input id="li-pass" type="password" placeholder="password" autocomplete="current-password">
        <button class="pri" id="li-go">Sign in</button>
      </div>
    </div>`;
  $("#li-go").onclick = () => do_login($("#li-name").value.trim(), $("#li-pass").value);
  $("#li-pass").onkeydown = e => { if (e.key === "Enter") $("#li-go").click(); };
}

async function do_login(name, pass) {
  try {
    const r = await api("POST", "/api/auth/login", { username: name, password: pass });
    TOKEN = r.token; localStorage.setItem("sk_token", TOKEN);
    await boot();
  } catch (e) { toast(e.message, true); }
}

/* ================= app shell after login =================
   Global refresh rule: every view exposes reload() = fetch + render as ONE
   call; mutations always await reload(). The shell (selectors, attention
   badge) refreshes on the same SSE cadence, so cross-page creates show up
   everywhere without a manual page reload. */
const REFRESHERS = new Set();
function mark_refresh(fn) { REFRESHERS.add(fn); return () => REFRESHERS.delete(fn); }
let refresh_t = null;
function schedule_refresh() {
  clearTimeout(refresh_t);
  refresh_t = setTimeout(() => {
    REFRESHERS.forEach(fn => { try { fn(); } catch { } });
    shell_refresh();
  }, 250);
}

const SHELL = { stacks: [], projects: [], prefs: {} };

async function shell_load() {
  const [stacks, projects, prefs] = await Promise.all([
    api("GET", "/api/stacks"),
    api("GET", "/api/projects"),
    api("GET", "/api/prefs").catch(() => ({})),
  ]);
  SHELL.stacks = stacks; SHELL.projects = projects; SHELL.prefs = prefs || {};
}

function current_project_id() {
  const m = (location.hash || "").match(/#\/project\/(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}

function shell_render_selectors() {
  const proj = SHELL.projects.find(p => p.id === current_project_id());
  const ssel = $("#sel-stack"), psel = $("#sel-project");
  const stacks = SHELL.stacks.filter(s => !s.archived);
  ssel.innerHTML = stacks.map(s =>
    `<option value="${s.id}" ${proj && proj.stack_id === s.id ? "selected" : ""}>${esc(s.name)}</option>`
  ).join("") + '<option value="__new">+ new stack…</option>';
  const groups = {};
  SHELL.projects.filter(p => !p.archived).forEach(p => {
    const key = p.stack_id || 0;
    (groups[key] = groups[key] || []).push(p);
  });
  let opt = "";
  for (const s of stacks) {
    const gp = (groups[s.id] || []).map(p =>
      `<option value="${p.id}" ${proj && proj.id === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
    if (gp) opt += `<optgroup label="${esc(s.name)}">${gp}</optgroup>`;
  }
  if (groups[0] && groups[0].length)
    opt += `<optgroup label="No stack">${groups[0].map(p =>
      `<option value="${p.id}" ${proj && proj.id === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</optgroup>`;
  const none = !opt;
  psel.innerHTML = opt + '<option value="__new">+ new project…</option>'
    + (none ? "" : "");
  ssel.style.display = ""; psel.style.display = "";
  if (proj && proj.stack_id) {
    const def = parseInt(SHELL.prefs.default_stack, 10) === proj.stack_id;
    $("#star").textContent = def ? "\u2605" : "\u2606";
    $("#star").title = def ? "default stack for you" : "make this your default stack";
  }
}

function shell_bind_selectors() {
  $("#sel-stack").onchange = async e => {
    if (e.target.value === "__new") { e.target.value = ""; return open_new_stack(); }
    const sid = parseInt(e.target.value, 10);
    const first = SHELL.projects.find(p => !p.archived && p.stack_id === sid);
    if (first) location.hash = `#/project/${first.id}/board`;
  };
  $("#sel-project").onchange = async e => {
    if (e.target.value === "__new") {
      const cur = current_project_id();
      const proj = SHELL.projects.find(p => p.id === cur);
      e.target.value = cur ? String(cur) : "";
      return open_new_project(proj ? proj.stack_id : null);
    }
    location.hash = `#/project/${e.target.value}/board`;
  };
  $("#star").onclick = async () => {
    const proj = SHELL.projects.find(p => p.id === current_project_id());
    if (!proj || !proj.stack_id) return toast("this project has no stack", true);
    try {
      await api("PUT", "/api/prefs/default_stack", { value: String(proj.stack_id) });
      SHELL.prefs.default_stack = String(proj.stack_id);
      shell_render_selectors();
      toast("default stack saved — you'll land here");
    } catch (e) { toast(e.message, true); }
  };
}

function open_new_stack() {
  modal_form("New stack", [
    { id: "name", label: "name", type: "title", required: true },
    { id: "slug", label: "slug (optional)" },
    { id: "description", label: "description", type: "textarea" },
  ], "create stack", async v => {
    const r = await api("POST", "/api/stacks",
      { name: v.name, slug: v.slug || undefined, description: v.description });
    await shell_refresh();
    toast("stack created");
    const sid = (r && r.id) || null;
    if (sid) {
      const s = SHELL.stacks.find(x => x.id === sid);
      if (s) $("#sel-stack").value = String(sid);
    }
  });
}

function open_new_project(stack_id) {
  modal_form("New project", [
    { id: "name", label: "name", type: "title", required: true },
    { id: "slug", label: "slug (optional)" },
    { id: "stack_id", label: "stack", type: "select",
      options: [["", "— no stack —"]].concat(SHELL.stacks.filter(s => !s.archived)

/* ================= bell: notifications + addressed inbox ================= */
async function bell_refresh() {
  if (!ME) return;
  try {
    const [notifs, inbox] = await Promise.all([
      api("GET", "/api/notifications"),
      api("GET", "/api/inbox?limit=50")]);
    const total = notifs.length + inbox.length;
    const b = $("#bellcount");
    b.style.display = total ? "" : "none";
    b.textContent = total > 99 ? "99+" : total;
    bell_render(notifs, inbox);
  } catch { }
}

function bell_render(notifs, inbox) {
  const row = (t, body, go) =>
    `<div class="notif" ${go ? `data-go="${go}"` : ""}>
       <div class="small dim">${t}</div><div>${body}</div></div>`;
  let html = "";
  for (const n of notifs)
    html += row("notification", esc(n.body),
      n.task_id ? `#/task/${n.task_id}` : null);
  for (const e of inbox)
    html += row("addressed · " + esc(e.verb),
      `${esc(e.obj_type)} #${e.obj_id}` +
      (e.project_id ? ` · project ${e.project_id}` : ""),
      e.obj_type === "task" ? `#/task/${e.obj_id}` :
      e.obj_type === "project" ? `#/project/${e.obj_id}/board` : null);
  $("#belldrop").innerHTML = html || '<div class="notif dim">nothing unread</div>';
  $$("#belldrop .notif[data-go]").forEach(el =>
    el.onclick = () => { location.hash = el.dataset.go; bell_close(); });
}

function bell_toggle() {
  const d = $("#belldrop");
  const open = d.style.display === "none";
  d.style.display = open ? "" : "none";
  if (open) bell_mark_read();
}

function bell_close() { $("#belldrop").style.display = "none"; }

async function bell_mark_read() {
  try {
    const notifs = await api("GET", "/api/notifications");
    for (const n of notifs)
      await api("POST", `/api/notifications/${n.id}/read`);
    const inbox = await api("GET", "/api/inbox?limit=100");
    if (inbox.length)
      await api("POST", "/api/inbox/read", { event_ids: inbox.map(e => e.id) });
    bell_refresh();
  } catch { }
}

/* ================= generic modal form =================
   Field types: title (big auto-growing textarea), text, textarea, select,
   tags (chip selector with suggestions + create-in-place), password. */
function modal_form(title, fields, submit_label, onsubmit, wide) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const fhtml = fields.map(f => `
    <label>${esc(f.label)}${f.required ? ' <span style="color:var(--bad)">*</span>' : ""}</label>
    ${f.type === "select"
      ? `<select id="mf-${f.id}" style="width:100%">${f.options.map(o =>
          `<option value="${esc(o[0])}" ${f.value === o[0] ? "selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`
      : f.type === "textarea"
        ? `<textarea id="mf-${f.id}">${esc(f.value || "")}</textarea>`
        : f.type === "title"
          ? `<textarea id="mf-${f.id}" class="bigtitle" rows="2"
               placeholder="${esc(f.placeholder || "")}">${esc(f.value || "")}</textarea>`
          : f.type === "tags"
            ? `<div id="mf-${f.id}" class="chips" data-tags="${esc(f.value || "")}"></div>`
            : `<input id="mf-${f.id}" style="width:100%" type="${f.type || "text"}" value="${esc(f.value || "")}"
                 ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}>`}`).join("");
  bg.innerHTML = `<div class="modal" ${wide ? 'style="width:min(720px,94vw)"' : ""}>
    <h3 style="margin-top:0">${title}</h3>${fhtml}
    <div class="row" style="margin-top:16px">
      <button class="pri" id="mf-go">${esc(submit_label)}</button>
      <button class="ghost" id="mf-cancel">cancel</button>
    </div></div>`;
  document.body.appendChild(bg);
  $("#mf-cancel", bg).onclick = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  let first_bad = null;
  fields.forEach(f => {
    const el = $(`#mf-${f.id}`, bg);
    if (f.type === "tags") {
      const sugg = (f.suggestions || []).slice();
      const chips = (f.value || "").split(",").map(s => s.trim()).filter(Boolean);
      const paint = () => {
        el.dataset.tags = chips.join(",");
        el.querySelectorAll(".chip").forEach(c => c.remove());
        const inp = $("input", el);
        chips.forEach((c, i) => {
          const sp = document.createElement("span");
          sp.className = "chip";
          sp.innerHTML = `${esc(c)} <b title="remove">×</b>`;
          $("b", sp).onclick = () => { chips.splice(chips.indexOf(c), 1); paint(); };
          el.insertBefore(sp, inp);
        });
      };
      const inp = document.createElement("input");
      inp.placeholder = "type a tag, Enter to add…";
      el.appendChild(inp);
      let menu = null;
      const close_menu = () => { if (menu) { menu.remove(); menu = null; } };
      const open_menu = () => {
        close_menu();
        const q = inp.value.trim().toLowerCase();
        const hits = sugg.filter(s => !chips.includes(s)
          && (!q || s.toLowerCase().includes(q))).slice(0, 6);
        const can_create = q && !sugg.includes(q) && !chips.includes(q);
        if (!hits.length && !can_create) return;
        menu = document.createElement("div");
        menu.className = "chipmenu";
        menu.innerHTML = hits.map(s => `<div>${esc(s)}</div>`).join("")
          + (can_create ? `<div><strong>Create “${esc(q)}”</strong></div>` : "");
        el.appendChild(menu);
        $$("div", menu).forEach((d, i) => d.onclick = () => {
          chips.push(i < hits.length ? hits[i] : q);
          inp.value = ""; paint(); close_menu(); inp.focus();
        });
      };
      inp.onkeydown = e => {
        if (e.key === "Enter") { e.preventDefault(); }
        if (e.key === "," || e.key === "Enter") {
          const v = inp.value.trim();
          if (v && !chips.includes(v)) { chips.push(v); if (!sugg.includes(v)) sugg.push(v); }
          inp.value = ""; paint(); close_menu();
        } else if (e.key === "Backspace" && !inp.value && chips.length) {
          chips.pop(); paint();
        }
      };
      inp.oninput = open_menu;
      inp.onblur = () => setTimeout(close_menu, 150);
      paint();
    }
    if (f.type === "title") {
      const fix = () => { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; };
      el.oninput = fix; setTimeout(fix, 0);
      setTimeout(() => el.focus(), 0);
    }
  });
  $("#mf-go", bg).onclick = async () => {
    const vals = {};
    let bad = null;
    fields.forEach(f => {
      const el = $(`#mf-${f.id}`, bg);
      vals[f.id] = f.type === "tags" ? el.dataset.tags : el.value;
      if (f.required && !String(vals[f.id] || "").trim() && !bad) bad = f;
    });
    if (bad) { toast(`${bad.label} is required`, true); return; }
    try { await onsubmit(vals); bg.remove(); }
    catch (e) { toast(e.message, true); }
  };
}

const ago = ts => {

  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 172800) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const state_chip = s => `<span class="tag t-${esc(s)} st-${esc(s)}">${esc(s)}</span>`;

function page_head(opts) {
  return `<div class="pagehead"><div style="min-width:0">
    <div class="crumb">${opts.crumb || ""}</div>
    <div class="typelabel">${esc(opts.type)}</div>

      ${opts.chip ? big_state(opts.chip) : ""}</h1>
    <div class="statusline">${opts.meta || ""}</div>

}

const stepper = cur => {
  const flow = ["idea", "plan", "proposed", "approved", "building", "review", "done"];
  const idx = flow.indexOf(cur);
  return `<div class="stepper">` + flow.map((s, i) => {
    const cls = i === idx ? "cur" : i < idx ? "done" : "";
    const dot = i < idx ? "\u2713 " : "";
    return `${i ? '<span class="sep">\u2192</span>' : ""}<span class="step ${cls}">${dot}${esc(s)}</span>`;
  }).join("") + `</div>`;
};

        return `<div class="kcard" data-task="${t.id}">
          <div class="kt">${esc(t.title)}</div>
          <div class="kmeta">
            ${t.priority === "high" || t.priority === "urgent"
              ? `<span class="tag t-${t.priority}">${esc(t.priority)}</span>` : ""}
            ${open_q_tasks.has(t.id) ? '<span class="tag t-proposed" title="has open question">\u2744</span>' : ""}
            ${t.proof_waived ? '<span class="tag t-done">waived</span>' : ""}
            ${tag_list.map(tg => `<span>${esc(tg)}</span>`).join("")}
            <span style="flex:1"></span>
            ${t.assignee_id ? avatar(t.assignee_id, IDNAME[t.assignee_id]) : ""}
            <span>${ago(t.state_changed_at)}</span>
          </div></div>`;
      }).join("");
      return `<div class="kcol"><h4><span class="st-${st}">${st}</span>
        <span class="cnt">${tasks.filter(t => t.state === st).length}</span></h4>
        ${cards || '<div class="dim small" style="padding:4px 2px">—</div>'}</div>`;
    }).join("");
    return `<div class="board">${cols}</div>`;
  };
  const tab_discussions = (discs, pid) => discs.length ? discs.map(d => `
    <div class="attrow"><span>
      ${d.status === "closed" ? "\uD83D\uDD12" : ""} <a href="#/discussion/${d.id}?p=${pid}">${esc(d.title)}</a>
      <span class="dim small">${esc(d.kind)} · ${d.comment_count || 0} comments · ${ago(d.created_at)}</span>
    </span></div>`).join("") : empty_block("No discussions",
      "decisions, proposals and handovers live here", `pd`);
  const tab_notes = (notes, pid) => (notes.length ? `
    <table><thead><tr><th>note</th><th>updated</th></tr></thead><tbody>
    ${notes.map(n => `<tr><td><a href="#/note/${n.id}">${esc(n.title)}</a></td>
      <td class="small dim">${ago(n.updated_at)}</td></tr>`).join("")}
    </tbody></table>` : empty_block("No notes", "durable project knowledge", "pn"))
    + `<div class="row" style="margin-top:10px"><button id="pn">+ note</button></div>`;
  const tab_decisions = (decs, pid) => decs.length ? decs.map(d => `
    <div class="card" style="margin-bottom:10px">
      <div class="spread"><strong>${esc(d.title)}</strong>
        ${state_chip(d.status === "accepted" ? "done" : d.status === "rejected" || d.status === "superseded" ? "trashed" : "proposed")}</div>
      <div class="small dim">${esc(d.status)} · ${ago(d.created_at)}</div>
      ${d.context ? `<div class="small" style="margin-top:6px">${md(d.context)}</div>` : ""}
      ${d.outcome ? `<div class="small" style="margin-top:6px"><strong>outcome:</strong> ${esc(d.outcome)}</div>` : ""}
    </div>`).join("") : empty_block("No decisions", "the project's law, recorded", "pdec");
  const empty_block = (big, small, btn) => `
    <div class="card"><div class="empty"><div class="big">${big}</div>${small}</div></div>`;
  function bind_project(pid, p, tag_suggestions) {
    $$("[data-task]").forEach(el => el.onclick = () =>
      location.hash = "#/task/" + el.dataset.task);
    const pe = $("#pe"); if (pe) pe.onclick = () => modal_form("Edit project", [
      { id: "name", label: "name", type: "title", value: p.name, required: true },
      { id: "description", label: "description", type: "textarea", value: p.description },
      { id: "stack_id", label: "stack", type: "select",
        options: [["", "— no stack —"]].concat(SHELL.stacks.filter(s => !s.archived)
          .map(s => [String(s.id), s.name])), value: p.stack_id ? String(p.stack_id) : "" },
    ], "save", async v => {
      await api("PATCH", `/api/projects/${pid}`, {
        name: v.name, description: v.description,
        stack_id: v.stack_id ? parseInt(v.stack_id, 10) : null });
      await shell_refresh(); toast("saved"); await reload();
    }, true);
    $("#pt").onclick = () => modal_form("New task", [
      { id: "title", label: "title", type: "title", required: true,
        placeholder: "One clear sentence — what needs doing?" },
      { id: "body", label: "body", type: "textarea" },
      { id: "priority", label: "priority", type: "select",
        options: ["medium", "low", "high", "urgent"].map(x => [x, x]) },
      { id: "assignee_id", label: "assignee", type: "select",
        options: [["", "— unassigned —"]].concat(Object.entries(IDNAME)
          .map(([id, name]) => [id, name])) },
      { id: "tags", label: "tags", type: "tags", suggestions: tag_suggestions },
    ], "create task", async v => {
      await api("POST", "/api/tasks", { project_id: pid, ...v,
        assignee_id: v.assignee_id ? parseInt(v.assignee_id, 10) : undefined });
      toast("task created — it starts as an idea on the board"); await reload();
    }, true);
    $("#pd").onclick = () => modal_form("New discussion", [
      { id: "title", label: "title", type: "title", required: true },
      { id: "kind", label: "kind", type: "select",
        options: ["info", "question", "proposal", "handover"].map(x => [x, x]) },
      { id: "body", label: "body", type: "textarea" },
    ], "create", async v => {
      await api("POST", `/api/projects/${pid}/discussions`, v); await reload();
    }, true);
    const pn = $("#pn"); if (pn) pn.onclick = () => modal_form("New note", [
      { id: "title", label: "title", type: "title", required: true },
      { id: "body", label: "body", type: "textarea" },
    ], "create", async v => {
      await api("POST", `/api/projects/${pid}/notes`, v); await reload();
    }, true);
    const pdec = $("#pdec"); if (pdec) pdec.onclick = () => modal_form("Propose decision", [
      { id: "title", label: "title", type: "title", required: true },
      { id: "context", label: "context", type: "textarea" },
    ], "propose", async v => {
      await api("POST", `/api/projects/${pid}/decisions`, v); await reload();
    }, true);
    $("#pa").onclick = async () => {
      try {
        await api("POST", `/api/projects/${pid}/${p.archived ? "unarchive" : "archive"}`);
        await shell_refresh(); await reload();
      } catch (e) { toast(e.message, true); }
    };
  }
  try { await shell_load(); await reload(); }
  catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(reload);
}
ROUTES.push({ name: "project", view: view_project });

/* identity name directory (display only) */
let IDNAME = {};
async function load_directory() {
  try {
    const rows = await api("GET", "/api/identities/directory");
    IDNAME = Object.fromEntries(rows.map(r => [r.id, r.name]));
  } catch { }
}
const idname = i => esc(IDNAME[i] || ("#" + i));

/* ================= Task detail ================= */
async function view_task(parts) {
  tab_highlight("");
  const tid = parseInt(parts[0], 10);
  const main = $("#main");
  main.innerHTML = '<p class="dim">loading…</p>';
  let data, qs, links;
  const reload = async () => {
    data = await api("GET", `/api/tasks/${tid}`);
    [qs, links] = await Promise.all([
      api("GET", `/api/questions?attach_type=task&attach_id=${tid}`),
      api("GET", `/api/context?type=task&id=${tid}`),
    ]);
    render();
  };
  const render = () => {
    const t = data.task;
    const proj = SHELL.projects.find(p => p.id === t.project_id)
      || { name: "project " + t.project_id, id: t.project_id };
    const stack = SHELL.stacks.find(s => s.id === proj.stack_id);
    const open_qs = qs.filter(q => q.status === "open");
    const is_human = ME.kind === "human";
    const frozen = open_qs.length > 0;
    const buttons = (NEXT[t.state] || [])
      .filter(n => is_human || !HUMAN_ONLY(n))
      .map(n => `<button ${n === "trashed" ? 'class="bad ghost"' : n === "done" || n === "approved" ? 'class="pri"' : ""}
        data-tr="${n}">${n === "previous"
          ? (t.state === "done" ? "not done" : "restore")
          : esc(TRANSITION_LABEL[n] || n)}</button>`).join(" ");
    const todo_html = data.todos.map(td => `
      <div class="row" style="justify-content:space-between;padding:3px 0">
        <label class="row" style="gap:8px">
          <input type="checkbox" class="check" data-tick="${td.id}"
                 ${td.done ? "checked" : ""}>
          <span class="${td.done ? "dim" : ""}">${esc(td.title)}</span></label>
        ${is_human ? `<button class="ghost small" data-tddel="${td.id}">×</button>` : ""}
      </div>`).join("");
    const proof_html = data.proofs.length
      ? data.proofs.map(p => `<div class="small" style="padding:3px 0">
            ${p.state ? `<span class="tag t-${p.state === "merged" || p.state === "closed" ? "done" : p.state === "open" ? "building" : "paused"}">${esc(p.state)}</span>` : ""}
            <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">
              ${esc(p.kind)}: ${esc(p.url.length > 52 ? p.url.slice(0, 52) + "…" : p.url)}</a>
            <span class="dim">${ago(p.added_at)}
              ${p.provider === "other" ? "· unverified" : "· " + esc(p.provider)}</span>
          </div>`).join("")
      : `<span class="dim small">none${t.proof_waived ? " (waived by human)" : ""}</span>`;
    const tr_html = data.transitions.map(tr => `
      <div class="small dim" style="padding:3px 0">${ago(tr.created_at)} —
        <span class="st-${esc(tr.to_state || "idea")}">${esc(tr.from_state || "new")}
        → ${esc(tr.to_state)}</span> by ${idname(tr.actor_id)}
        ${tr.note ? `<div class="md">${md(tr.note)}</div>` : ""}</div>`).join("");
    const q_html = qs.map(q => `
      <div class="comment ${q.status === "open" ? "qopen" : ""}">
        <div class="small dim">#${q.id} ${q.status} · ${ago(q.created_at)} ·
          ${idname(q.asked_by)} →
          ${q.asked_to_group ? "group:" + esc(q.asked_to_group) : idname(q.asked_to_id)}</div>
        <div class="md">${md(q.body)}</div>
        ${q.status === "answered"
          ? `<div class="small"><strong>${idname(q.answered_by)}:</strong> ${md(q.answer)}</div>`
          : is_human && q.asked_to_id === ME.id
            ? `<button data-qans="${q.id}">answer</button>` : ""}
      </div>`).join("");
    const link_html = (links || []).map(l => `
      <span class="tag t-idea" data-goto="${esc(l.type)}:${l.id}" style="cursor:pointer">
        ${esc(l.type)} #${l.id} ${esc(l.title || "")}</span>`).join(" ");
    const tag_list = (t.tags || "").split(",").map(s => s.trim()).filter(Boolean);
    main.innerHTML = page_head({
      type: "TASK",
      crumb: `${stack ? `<a href="#/organize">${esc(stack.name)}</a> <span>/</span>` : ""}
        <a href="#/project/${t.project_id}/board">${esc(proj.name)}</a> <span>/</span><span>task</span>`,
      title: esc(t.title),
      chip: t.state,
      meta: stepper(t.state)
        + (t.state === "paused" ? '<span class="tag t-paused">parked</span>' : "")
        + `<span class="dim">#${t.id} · v${t.version} · ${esc(t.priority)} priority
           ${tag_list.length ? "· " + tag_list.map(x => `<span class="tag t-idea">${esc(x)}</span>`).join(" ") : ""}
           · by ${idname(t.created_by)}
           ${t.assignee_id ? "· assigned to " + idname(t.assignee_id) : ""}
           ${t.state_changed_by ? "· last moved by " + idname(t.state_changed_by) : ""}</span>`,
      actions: buttons,
    })
    + (frozen ? `<div class="card frozen" style="margin-bottom:12px">
        <strong>\u2744 Frozen — ${open_qs.length} open question${open_qs.length > 1 ? "s" : ""}</strong>
        ${q_html}</div>` : "")
    + `<div class="grid" style="grid-template-columns:2fr 1fr;align-items:start">
      <div class="grid">
        <div class="card"><h3>Description</h3>
          <div class="md">${md(t.body) || '<span class="dim small">no description</span>'}</div>
          <div class="row" style="margin-top:8px">
            <button class="ghost" id="t-edit">edit task</button>
            <button class="ghost" id="t-ask">ask question</button>
          </div></div>
        ${!frozen && q_html ? `<div class="card"><h3>Questions</h3>${q_html}</div>` : ""}
        <div class="card"><h3>Checklist</h3>
          ${todo_html || '<p class="dim small">none</p>'}
          <div class="row" style="margin-top:8px">
            <input id="td-new" placeholder="add checklist item" style="flex:1">
            <button id="td-add">add</button></div></div>
        <div class="card"><h3>Proof</h3>${proof_html}
          <div class="row" style="margin-top:6px">
            <input id="pf-url" placeholder="https://github.com/…/pull/N" style="flex:1">
            <button id="pf-add">attach</button>
            <button class="ghost" id="pf-check">check state</button>
            ${is_human && !t.proof_waived ? `<button class="ghost" id="t-waive">waive</button>` : ""}
          </div></div>
        <div class="card"><h3>History</h3>
          ${tr_html || '<p class="dim small">no transitions yet — this task is a fresh idea</p>'}</div>
      </div>
      <div class="grid">
        <div class="card"><h3>Move this task</h3>
          <div class="dim small" style="margin-bottom:8px">current state: <strong class="st-${esc(t.state)}">${esc(t.state)}</strong></div>
          <div class="grid" style="gap:6px">${buttons || '<span class="dim small">terminal state</span>'}</div>
          ${frozen ? '<div class="small dim" style="margin-top:8px">\u2744 frozen while questions are open</div>' : ""}
        </div>
        ${link_html ? `<div class="card"><h3>Context</h3><div class="row">${link_html}</div></div>` : ""}
      </div></div>`;
    $$("[data-tr]").forEach(b => b.onclick = () => {
      const to = b.dataset.tr;
      if (to === "trashed" && !confirm("Trash this task?")) return;
      const need_note = to === "done" || to === "previous";
      const t_now = data.task;
      modal_form(`Move to “${TRANSITION_LABEL[to] || to}”`, [
        { id: "note", label: HUMAN_NOTE(to), type: "textarea" },
      ], "confirm", async v => {
        await api("POST", `/api/tasks/${tid}/transition`,
          { to, note: v.note, version: t_now.version });
        toast("\u2192 " + to); await reload();
      });
    });
    $$("[data-tick]").forEach(cb => cb.onclick = async () => {
      try {
        const td = data.todos.find(x => x.id === parseInt(cb.dataset.tick, 10));
        await api("POST", `/api/todos/${td.id}/${cb.checked ? "tick" : "untick"}`,
          { version: td.version });
        await reload();
      } catch (e) { toast(e.message, true); await reload(); }
    });
    $$("[data-tddel]").forEach(b => b.onclick = async () => {
      try { await api("DELETE", `/api/todos/${b.dataset.tddel}`); await reload(); }
      catch (e) { toast(e.message, true); }
    });
    $$("[data-qans]").forEach(b => b.onclick = () =>
      modal_form("Answer question", [
        { id: "answer", label: "answer", type: "textarea" },
      ], "answer", async v => {
        await api("POST", `/api/questions/${b.dataset.qans}/answer`, v);
        toast("answered"); await reload();
      }));
    $$("[data-goto]").forEach(el => el.onclick = () => {
      const [ty, id] = el.dataset.goto.split(":");
      location.hash = "#/" + (ty === "task" ? "task" : ty === "project"
        ? "project" : ty === "discussion" ? "discussion" : "project") + "/" + id;
    });
    const add_todo = async () => {
      const v = $("#td-new").value.trim();
      if (!v) return;
      try { await api("POST", `/api/tasks/${tid}/todos`, { title: v }); }
      catch (e) { return toast(e.message, true); }
      await reload();
    };
    $("#td-add").onclick = add_todo;
    $("#t-ask").onclick = () => modal_form("Ask about this task", [
      { id: "body", label: "question", type: "textarea" },
      { id: "to", label: "to (identity name, blank = anyone)" },
    ], "ask", async v => {
      let to_id;
      if (v.to) {
        const e = Object.entries(IDNAME).find(([, n]) => n === v.to);
        if (!e) throw new Error("no such identity: " + v.to);
        to_id = parseInt(e[0], 10);
      }
      await api("POST", "/api/questions", {
        project_id: t.project_id, body: v.body, attach_type: "task", attach_id: tid,
        to_identity_id: to_id });
      toast("asked — the task is frozen until answered"); await reload();
    }, true);
    $("#t-edit").onclick = () => api("GET", `/api/tags?project=${t.project_id}`)
      .catch(() => ({ tags: [] })).then(({ tags }) => modal_form("Edit task", [
        { id: "title", label: "title", type: "title", value: t.title, required: true },
        { id: "body", label: "body", type: "textarea", value: t.body },
        { id: "priority", label: "priority", type: "select",
          options: ["low", "medium", "high", "urgent"].map(x => [x, x]),
          value: t.priority },
        { id: "tags", label: "tags", type: "tags", value: t.tags, suggestions: tags.tags || [] },
      ], "save", async v => {
        await api("PATCH", `/api/tasks/${tid}`, { ...v, version: t.version });
        await reload();
      }, true));
    $("#pf-add").onclick = async () => {
      const v = $("#pf-url").value.trim();
      if (!v) return;
      try {
        await api("POST", `/api/tasks/${tid}/proofs`, { url: v });
        toast("proof attached"); await reload();
      } catch (e) { toast(e.message, true); }
    };
    $("#pf-check").onclick = async () => {
      try {
        const rs = await api("POST", `/api/tasks/${tid}/proofs/check`);
        toast(rs.length ? "state: " + rs.map(x => x.state || "?").join(", ")
          : "nothing checkable / inert");
        await reload();
      } catch (e) { toast(e.message, true); }
    };
    const waive = $("#t-waive");
    if (waive) waive.onclick = async () => {
      try {
        await api("PATCH", `/api/tasks/${tid}`,
          { proof_waived: true, version: t.version });
        toast("proof waived"); await reload();
      } catch (e) { toast(e.message, true); }
    };
  };
  try { await shell_load(); await load_directory(); await reload(); }
  catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(reload);
}
ROUTES.push({ name: "task", view: view_task });

/* ================= Discussion ================= */
async function view_discussion(parts) {
  tab_highlight("");
  const q = parts[0].split("?");
  const did = parseInt(q[0], 10);
  const pid = new URLSearchParams((q[1] || "")).get("p");
  const main = $("#main");
  let comments, disc = null, proj = null;
  const reload = async () => {
    comments = await api("GET", `/api/discussions/${did}`);
    if (pid) {
      const ds = await api("GET", `/api/projects/${pid}/discussions`);
      disc = ds.find(d => d.id === did) || null;
      proj = SHELL.projects.find(p => p.id === parseInt(pid, 10));
    }
    render();
  };
  const render = () => {
    const html = comments.map(c => `
      <div class="comment ${c.trashed_at ? "trashed" : ""}">
        <div class="small dim">${idname(c.author_id)} · ${ago(c.created_at)}
          ${c.trashed_at ? "· TRASHED" : ""}</div>
        <div class="md">${md(c.body)}</div>
        ${!c.trashed_at && ME.kind === "human"
          ? `<button class="ghost small" data-ctrash="${c.id}">trash</button>` : ""}
      </div>`).join("");
    main.innerHTML = page_head({
      type: "DISCUSSION" + (disc && disc.status === "closed" ? " · CLOSED" : ""),
      crumb: proj ? `<a href="#/project/${pid}/discussions">${esc(proj.name)}</a> <span>/</span><span>discussion</span>`
        : `<span>discussion</span>`,
      title: esc(disc ? disc.title : "#" + did),
      chip: disc ? (disc.status === "closed" ? "paused" : "plan") : null,
      meta: disc ? `<span class="dim small">${esc(disc.kind)} · ${ago(disc.created_at)}</span>` : "",
      actions: `${disc && disc.status === "open" && ME.kind === "human"
        ? `<button id="d-close">close discussion</button>` : ""}`,
    })
    + (disc ? `<div class="md card" style="margin-bottom:10px">${md(disc.body)}</div>` : "")
    + `<div style="margin:12px 0">${html || '<p class="dim">no comments yet — say something</p>'}</div>
      <div class="row"><input id="c-new" placeholder="comment" style="flex:1">
        <button class="pri" id="c-add">comment</button></div>`;
    $$("[data-ctrash]").forEach(b => b.onclick = async () => {
      try { await api("POST", `/api/comments/${b.dataset.ctrash}/trash`); await reload(); }
      catch (e) { toast(e.message, true); }
    });
    const close = $("#d-close");
    if (close) close.onclick = async () => {
      try { await api("POST", `/api/discussions/${did}/close`); await reload(); }
      catch (e) { toast(e.message, true); }
    };
    $("#c-add").onclick = async () => {
      const v = $("#c-new").value.trim();
      if (!v) return;
      try { await api("POST", `/api/discussions/${did}/comments`, { body: v }); }
      catch (e) { return toast(e.message, true); }
      $("#c-new").value = ""; await reload();
    };
    $("#c-new").onkeydown = e => { if (e.key === "Enter") $("#c-add").click(); };
  };
  try { await shell_load(); await load_directory(); await reload(); }
  catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(reload);
}
ROUTES.push({ name: "discussion", view: view_discussion });

/* ================= Note ================= */
async function view_note(parts) {
  tab_highlight("");
  const nid = parseInt(parts[0], 10);
  const main = $("#main");
  let data;
  const reload = async () => { data = await api("GET", `/api/notes/${nid}`); render(); };
  const render = () => {
    const n = data.note;
    const proj = SHELL.projects.find(p => p.id === n.project_id);
    main.innerHTML = page_head({
      type: "NOTE",
      crumb: proj ? `<a href="#/project/${n.project_id}/notes">${esc(proj.name)}</a> <span>/</span><span>note</span>`
        : `<span>note</span>`,
      title: esc(n.title),
      meta: `<span class="dim small">updated ${ago(n.updated_at)}</span>`,
      actions: `<button id="n-edit">edit</button>`,
    })
    + `<div class="md card" style="margin:10px 0">${md(n.body)}</div>
      ${data.revisions.length ? `<details><summary class="dim small">
        ${data.revisions.length} revisions</summary>
        ${data.revisions.map(r => `<div class="small dim" style="margin:4px 0">
          ${ago(r.created_at)} — ${esc(r.title)}</div>`).join("")}</details>` : ""}`;

/* ================= Activity (filtered event log) ================= */
const ACT = { project: "", type: "", actor: "", timeframe: "7d", limit: 200 };
async function view_activity() {
  tab_highlight("activity");
  const main = $("#main");
  const reload = async () => {
    try {
      // `since` on /api/events is an event-ID cursor, not a timestamp —
      // timeframes filter client-side on ts after fetching the tail.
      const hours = { "1h": 1, "24h": 24, "7d": 168, "30d": 720, "all": 0 };
      const cutoff = hours[ACT.timeframe]
        ? Date.now() / 1000 - hours[ACT.timeframe] * 3600 : 0;
      let q = `/api/events?desc=1&limit=${ACT.limit}`;
      if (ACT.project) q += `&project=${ACT.project}`;
      if (ACT.type) q += `&type=${ACT.type}`;
      let evs = await api("GET", q);
      if (ACT.actor) evs = evs.filter(e => String(e.actor_id) === ACT.actor);
      if (cutoff) evs = evs.filter(e => e.ts >= cutoff);
      render(evs);
    } catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  };
  const render = events => {
    const rows = events.map(e => `<tr>
      <td class="small dim">${new Date(e.ts * 1000).toLocaleString()}</td>
      <td class="small">${idname(e.actor_id)}</td>
      <td class="mono small">${esc(e.verb)}</td>
      <td class="small">${esc(e.obj_type)} #${e.obj_id}
        ${e.obj_type === "task" ? `<a class="small" href="#/task/${e.obj_id}">\u2192</a>` : ""}
        ${e.obj_type === "project" ? `<a class="small" href="#/project/${e.obj_id}/board">\u2192</a>` : ""}</td>
      <td class="small dim">${e.project_id || ""}</td>
      <td class="small dim">${esc(e.to_identity_id ? "\u2192 " + idname(e.to_identity_id) : "")}</td>
    </tr>`).join("");
    main.innerHTML = page_head({
      type: "LOG", title: "Activity",
      meta: `<span class="dim small">${events.length} shown · tamper-evident</span>`,
    })
    + `<div class="card row" style="margin:10px 0">
        <label class="small dim">project</label>
        <select id="a-proj"><option value="">all</option></select>
        <label class="small dim">type</label>
        <select id="a-type">
          <option value="">all</option>
          ${["task", "todo", "project", "question", "decision", "discussion",
             "comment", "note", "wiki", "proof", "identity"].map(x =>
            `<option ${ACT.type === x ? "selected" : ""}>${x}</option>`).join("")}
        </select>
        <label class="small dim">actor</label>
        <select id="a-actor"><option value="">all</option></select>
        <label class="small dim">timeframe</label>
        <select id="a-time">
          ${[["1h", "last hour"], ["24h", "24 hours"], ["7d", "7 days"],
             ["30d", "30 days"], ["all", "all time"]].map(([v, l]) =>
            `<option value="${v}" ${ACT.timeframe === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <button id="a-go">apply</button>
      </div>
      <table><thead><tr><th>when</th><th>who</th><th>verb</th><th>object</th>
        <th>proj</th><th>to</th></tr></thead><tbody>${rows}</tbody></table>`;
    const proj_sel = $("#a-proj"), actor_sel = $("#a-actor");
    proj_sel.innerHTML = '<option value="">all</option>' + SHELL.projects.map(p =>
      `<option value="${p.id}" ${String(ACT.project) === String(p.id) ? "selected" : ""}>
       ${esc(p.name)}</option>`).join("");
    actor_sel.innerHTML = '<option value="">all</option>' +
      Object.entries(IDNAME).map(([id, name]) =>
        `<option value="${id}" ${ACT.actor === id ? "selected" : ""}>${esc(name)}</option>`).join("");
    $("#a-go").onclick = () => {
      ACT.project = proj_sel.value; ACT.type = $("#a-type").value;
      ACT.actor = actor_sel.value; ACT.timeframe = $("#a-time").value;
      reload();
    };
  };
  try { await shell_load(); await load_directory(); await reload(); }
  catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(reload);
}
ROUTES.push({ name: "activity", view: view_activity });

/* ================= boot ================= */
if (TOKEN) boot(); else render_auth();

</script>
</body>
</html>
