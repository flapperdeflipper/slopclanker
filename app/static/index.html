<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlopClanker</title>
<style>
:root{--bg:#101418;--pan:#181e24;--pan2:#1f272f;--fg:#dfe6ec;--dim:#8a98a5;
--acc:#4fb6ff;--ok:#5ad4a0;--warn:#ffb454;--bad:#ff6b7a;--line:#2a333c;
--idea:#8a98a5;--plan:#4fb6ff;--proposed:#c792ea;--approved:#5ad4a0;
--building:#ffb454;--review:#ffd866;--done:#5ad4a0;--paused:#7f8fa0;--trashed:#ff6b7a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--pan);
border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .logo{font-weight:700;letter-spacing:.5px}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{padding:5px 10px;border-radius:6px;color:var(--dim)}
nav a.on{background:var(--pan2);color:var(--fg)}
main{padding:18px;max-width:1200px;margin:0 auto}
button{background:var(--pan2);color:var(--fg);border:1px solid var(--line);
border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#08222f;border-color:var(--acc);font-weight:600}
button.bad{color:var(--bad);border-color:#5c2a32}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--pan2);border:1px solid var(--line);color:var(--fg);
border-radius:6px;padding:6px 9px;font:inherit}
textarea{width:100%;min-height:70px;resize:vertical}
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grid{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dim{color:var(--dim)}.small{font-size:12px}.mono{font-family:ui-monospace,monospace}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600}
.t-idea{background:#2a333c}.t-plan{background:#123a55}.t-proposed{background:#3a2a55}
.t-approved{background:#14452f}.t-building{background:#553d1a}.t-review{background:#554a1a}
.t-done{background:#14452f}.t-paused{background:#333d49}.t-trashed{background:#55232b}
.st-idea{color:var(--idea)}.st-plan{color:var(--plan)}.st-proposed{color:var(--proposed)}
.st-approved{color:var(--approved)}.st-building{color:var(--building)}
.st-review{color:var(--review)}.st-done{color:var(--done)}
.st-paused{color:var(--paused)}.st-trashed{color:var(--trashed)}
.badge{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-size:12px;font-weight:600}
.comment{border-left:3px solid var(--line);padding:6px 12px;margin:8px 0}
.comment.trashed{opacity:.55;border-left-color:var(--bad)}
.modal-bg{position:fixed;inset:0;background:rgba(4,8,12,.7);display:flex;
align-items:center;justify-content:center;z-index:20}
.modal{background:var(--pan);border:1px solid var(--line);border-radius:12px;
padding:18px;width:min(560px,92vw);max-height:86vh;overflow:auto}
.bell{position:relative}
.bell .badge{position:absolute;top:-6px;right:-8px;cursor:pointer}
.bell-drop{position:absolute;right:0;top:36px;width:380px;max-height:60vh;overflow:auto;
background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px;z-index:10}
.notif{padding:7px 9px;border-bottom:1px solid var(--line)}
.qopen{background:#3a2a55}
.frozen{outline:2px dashed var(--proposed);outline-offset:2px}
.check{width:16px;height:16px;accent-color:var(--acc)}
.pill{cursor:pointer}
#toast{position:fixed;bottom:18px;right:18px;z-index:50;display:grid;gap:8px}
.tst{background:var(--pan2);border:1px solid var(--line);border-radius:8px;
padding:9px 14px;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.tst.err{border-color:var(--bad)}
.md p{margin:6px 0}.md code{background:var(--pan2);padding:1px 5px;border-radius:4px;
font-family:ui-monospace,monospace;font-size:12.5px}
.md pre{background:var(--pan2);padding:10px;border-radius:8px;overflow:auto}
.md ul{margin:6px 0;padding-left:22px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lane{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
.lane h4{margin:0 0 8px;color:var(--dim);font-size:12px;text-transform:uppercase}
.tcard{background:var(--pan2);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.tcard:hover{outline:1px solid var(--acc)}
.kanban{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}
</style>
</head>
<body>
<header>
  <span class="logo">&#9879; SlopClanker</span>
  <nav id="nav"></nav>
  <span style="flex:1"></span>
  <span id="me" class="dim small"></span>
  <div class="bell" id="bell" style="display:none">
    <button class="ghost" id="bellbtn">&#128276;</button>
    <span class="badge" id="bellcount" style="display:none"></span>
    <div class="bell-drop" id="belldrop" style="display:none"></div>
  </div>
  <button class="ghost" id="logout" style="display:none">logout</button>
</header>
<main id="main"><p class="dim">loading…</p></main>
<div id="toast"></div>
<script>
"use strict";
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
let TOKEN = localStorage.getItem("sk_token") || "";
let ME = null;

function toast(msg, err) {
  const d = document.createElement("div");
  d.className = "tst" + (err ? " err" : "");
  d.textContent = msg;
  $("#toast").appendChild(d);
  setTimeout(() => d.remove(), 4200);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function md(src) {
  let t = esc(src || "");
  t = t.replace(/```([\s\S]*?)```/g, (_, c) => "<pre>" + c.trim() + "</pre>");
  t = t.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/^###? (.+)$/gm, "<strong>$1</strong>");
  t = t.replace(/^- (.+)$/gm, "<li>$1</li>");
  t = t.replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>");
  return t.split(/\n{2,}/).map(p =>
    /^<(ul|pre|strong)/.test(p) ? p : "<p>" + p.replace(/\n/g, "<br>") + "</p>"
  ).join("");
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (TOKEN) opt.headers.Authorization = "Bearer " + TOKEN;
  if (body !== undefined) opt.headers["Content-Type"] = "application/json";
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  if (r.status === 401 && TOKEN) { logoutLocal(); throw new Error("session expired"); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
  return data;
}

function logoutLocal() { TOKEN = ""; ME = null; localStorage.removeItem("sk_token"); route(); }

/* ---- SSE: one multiplexed stream, since-cursor reconnect, poll fallback */
const SSE = { ctrl: null, since: 0, handlers: new Set(), fails: 0, timer: null };

function sse_on(fn) { SSE.handlers.add(fn); return () => SSE.handlers.delete(fn); }

function sse_start() {
  sse_stop();
  if (!TOKEN) return;
  SSE.timer = setTimeout(sse_poll_fallback, 15000);
  (async () => {
    const ctl = new AbortController();
    SSE.ctrl = ctl;
    try {
      const r = await fetch("/api/stream?since=" + SSE.since, {
        headers: { Authorization: "Bearer " + TOKEN }, signal: ctl.signal });
      if (!r.ok || !r.body) throw new Error("stream " + r.status);
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          for (const line of frame.split("\n")) {
            if (line.startsWith("id: ")) SSE.since = parseInt(line.slice(4)) || SSE.since;
            if (line.startsWith("data: ")) {
              SSE.fails = 0; clearTimeout(SSE.timer);
              SSE.timer = setTimeout(sse_poll_fallback, 30000);
              let ev = null;
              try { ev = JSON.parse(line.slice(6)); } catch { }
              if (ev) SSE.handlers.forEach(fn => { try { fn(ev); } catch { } });
            }
          }
        }
      }
    } catch { /* aborted or dropped */ }
    if (SSE.ctrl === ctl && TOKEN) {
      SSE.fails++;
      setTimeout(sse_start, Math.min(1000 * SSE.fails, 10000));
    }
  })();
}

function sse_stop() {
  if (SSE.ctrl) { SSE.ctrl.abort(); SSE.ctrl = null; }
  clearTimeout(SSE.timer);
}

async function sse_poll_fallback() {
  if (!TOKEN) return;
  try {
    const evs = await api("GET", "/api/events?since=" + SSE.since + "&limit=100");
    for (const ev of evs) { SSE.since = Math.max(SSE.since, ev.id); SSE.handlers.forEach(fn => fn(ev)); }
  } catch { }
  SSE.timer = setTimeout(sse_poll_fallback, 8000);
}

/* ---- router */
const ROUTES = [];
function route() {
  const h = location.hash || "#/";
  if (!TOKEN) return render_auth();
  const parts = h.slice(2).split("/");
  const name = parts[0] || "landscape";
  const fn = ROUTES.find(r => r.name === name);
  (fn ? fn.view : view_landscape)(parts.slice(1));
}
window.addEventListener("hashchange", () => route());

/* ================= auth (setup wizard / login) ================= */
async function render_auth() {
  sse_stop();
  $("#nav").innerHTML = ""; $("#me").textContent = ""; $("#bell").style.display = "none";
  $("#logout").style.display = "none";
  let st = {};
  try { st = await api("GET", "/api/setup"); } catch { }
  if (st.setup_required) {
    $("#main").innerHTML = `
      <div class="card" style="max-width:420px;margin:8vh auto">
        <h2 style="margin-top:0">First-time setup</h2>
        <p class="dim">Create the superadmin account. This screen never appears again.</p>
        <div class="grid">
          <input id="su-name" placeholder="admin username" autocomplete="username">
          <input id="su-pass" type="password" placeholder="password (min 10 chars)"
                 autocomplete="new-password">
          <button class="pri" id="su-go">Create &amp; sign in</button>
        </div>
      </div>`;
    $("#su-go").onclick = async () => {
      try {
        await api("POST", "/api/setup", {
          username: $("#su-name").value.trim(),
          password: $("#su-pass").value });
        toast("superadmin created");
        await do_login($("#su-name").value.trim(), $("#su-pass").value);
      } catch (e) { toast(e.message, true); }
    };
    return;
  }
  $("#main").innerHTML = `
    <div class="card" style="max-width:420px;margin:8vh auto">
      <h2 style="margin-top:0">&#9879; SlopClanker</h2>
      <p class="dim">Sign in for humans. Clankers enroll through their agents.</p>
      <div class="grid">
        <input id="li-name" placeholder="username" autocomplete="username">
        <input id="li-pass" type="password" placeholder="password" autocomplete="current-password">
        <button class="pri" id="li-go">Sign in</button>
      </div>
    </div>`;
  $("#li-go").onclick = () => do_login($("#li-name").value.trim(), $("#li-pass").value);
  $("#li-pass").onkeydown = e => { if (e.key === "Enter") $("#li-go").click(); };
}

async function do_login(name, pass) {
  try {
    const r = await api("POST", "/api/auth/login", { username: name, password: pass });
    TOKEN = r.token; localStorage.setItem("sk_token", TOKEN);
    await boot();
  } catch (e) { toast(e.message, true); }
}

/* ================= app shell after login ================= */
const REFRESHERS = new Set();
function mark_refresh(fn) { REFRESHERS.add(fn); return () => REFRESHERS.delete(fn); }
let refresh_t = null;
function schedule_refresh() {
  clearTimeout(refresh_t);
  refresh_t = setTimeout(() => REFRESHERS.forEach(fn => { try { fn(); } catch { } }), 250);
}

async function boot() {
  try { ME = await api("GET", "/api/auth/whoami"); }
  catch { return; }
  const tabs = [["landscape", "Landscape"], ["activity", "Activity"],
                ["trash", "Trash"]];
  if (ME.role === "admin" || ME.role === "superadmin")
    tabs.splice(1, 0, ["identities", "Identities"]);
  $("#nav").innerHTML = tabs.map(t =>
    `<a href="#/${t[0]}" data-tab="${t[0]}">${t[1]}</a>`).join("");
  $("#me").textContent = `${ME.name} · ${ME.role}`;
  $("#logout").style.display = ""; $("#bell").style.display = "";
  $("#logout").onclick = async () => {
    try { await api("POST", "/api/auth/logout"); } catch { }
    logoutLocal();
  };
  sse_on(() => { schedule_refresh(); bell_refresh(); });
  SSE.since = Math.floor(Date.now() / 1000) - 5;
  sse_start();
  bell_refresh();
  $("#bellbtn").onclick = bell_toggle;
  route();
}

function tab_highlight() {
  $$("nav a").forEach(a =>
    a.classList.toggle("on", a.dataset.tab === (location.hash.slice(2).split("/")[0] || "landscape")));
}

/* ================= bell: notifications + addressed inbox ================= */
async function bell_refresh() {
  if (!ME) return;
  try {
    const [notifs, inbox] = await Promise.all([
      api("GET", "/api/notifications"),
      api("GET", "/api/inbox?limit=50")]);
    const total = notifs.length + inbox.length;
    const b = $("#bellcount");
    b.style.display = total ? "" : "none";
    b.textContent = total > 99 ? "99+" : total;
    bell_render(notifs, inbox);
  } catch { }
}

function bell_render(notifs, inbox) {
  const row = (t, body, go) =>
    `<div class="notif" ${go ? `data-go="${go}"` : ""}>
       <div class="small dim">${t}</div><div>${body}</div></div>`;
  let html = "";
  for (const n of notifs)
    html += row("notification", esc(n.body),
      n.task_id ? `#/task/${n.task_id}` : null);
  for (const e of inbox)
    html += row("addressed · " + esc(e.verb),
      `${esc(e.obj_type)} #${e.obj_id}` +
      (e.project_id ? ` · project ${e.project_id}` : ""),
      e.obj_type === "task" ? `#/task/${e.obj_id}` :
      e.obj_type === "project" ? `#/project/${e.obj_id}` : null);
  $("#belldrop").innerHTML = html || '<div class="notif dim">nothing unread</div>';
  $$("#belldrop .notif[data-go]").forEach(el =>
    el.onclick = () => { location.hash = el.dataset.go; bell_close(); });
}

function bell_toggle() {
  const d = $("#belldrop");
  const open = d.style.display === "none";
  d.style.display = open ? "" : "none";
  if (open) bell_mark_read();
}

function bell_close() { $("#belldrop").style.display = "none"; }

async function bell_mark_read() {
  try {
    const notifs = await api("GET", "/api/notifications");
    for (const n of notifs)
      await api("POST", `/api/notifications/${n.id}/read`);
    const inbox = await api("GET", "/api/inbox?limit=100");
    if (inbox.length)
      await api("POST", "/api/inbox/read", { event_ids: inbox.map(e => e.id) });
    bell_refresh();
  } catch { }
}

/* ================= generic modal form ================= */
function modal_form(title, fields, submit_label, onsubmit, wide) {
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  const fhtml = fields.map(f => `
    <label class="small dim" style="display:block;margin:8px 0 3px">${esc(f.label)}</label>
    ${f.type === "select"
      ? `<select id="mf-${f.id}">${f.options.map(o =>
          `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select>`
      : f.type === "textarea"
        ? `<textarea id="mf-${f.id}"></textarea>`
        : `<input id="mf-${f.id}" type="${f.type || "text"}" value="${esc(f.value || "")}"
             ${f.type === "number" ? 'style="width:110px"' : ""}
             ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ""}>`}`).join("");
  bg.innerHTML = `<div class="modal" ${wide ? 'style="width:min(760px,94vw)"' : ""}>
    <h3 style="margin-top:0">${title}</h3>${fhtml}
    <div class="row" style="margin-top:14px">
      <button class="pri" id="mf-go">${esc(submit_label)}</button>
      <button class="ghost" id="mf-cancel">cancel</button>
    </div></div>`;
  document.body.appendChild(bg);
  $("#mf-cancel", bg).onclick = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  $("#mf-go", bg).onclick = async () => {
    const vals = {};
    fields.forEach(f => { vals[f.id] = $(`#mf-${f.id}`, bg).value; });
    try { await onsubmit(vals); bg.remove(); }
    catch (e) { toast(e.message, true); }
  };
}

const STATES = ["idea", "plan", "proposed", "approved", "building", "review",
                "done", "paused", "trashed"];
const NEXT = {
  idea: ["plan", "paused", "trashed"],
  plan: ["proposed", "paused", "trashed"],
  proposed: ["approved", "plan", "paused", "trashed"],
  approved: ["building", "paused", "trashed"],
  building: ["review", "paused", "trashed"],
  review: ["done", "building", "plan", "approved", "paused", "trashed"],
  paused: ["plan", "proposed", "approved", "building", "review", "trashed"],
  done: ["previous"],
  trashed: ["previous"],
};
const HUMAN_ONLY = t => t === "trashed" || t === "previous" || t === "approved" || t === "done";
const HUMAN_NOTE = t => t === "done" || t === "previous"
  ? "reason (required for override)" : "note (optional)";
const ago = ts => {
  if (!ts) return "";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 90) return Math.round(s) + "s ago";
  if (s < 5400) return Math.round(s / 60) + "m ago";
  if (s < 172800) return Math.round(s / 3600) + "h ago";
  return Math.round(s / 86400) + "d ago";
};
const state_chip = s => `<span class="tag t-${esc(s)} st-${esc(s)}">${esc(s)}</span>`;


/* ================= Landscape ================= */
async function view_landscape() {
  tab_highlight();
  const main = $("#main");
  main.innerHTML = '<p class="dim">loading…</p>';
  let stacks, projs, qs, props, revs, regs, PROOF_STATES = {};
  const load = async () => {
    [stacks, projs, qs, props, revs] = await Promise.all([
      api("GET", "/api/stacks"),
      api("GET", "/api/projects"),
      api("GET", "/api/questions?open=1"),
      api("GET", "/api/tasks?state=proposed"),
      api("GET", "/api/tasks?state=review"),
    ]);
    if (ME.role === "admin" || ME.role === "superadmin")
      regs = await api("GET", "/api/registrations").catch(() => []);
    PROOF_STATES = {};
    await Promise.all(revs.map(async t => {
      try {
        const ps = await api("GET", `/api/tasks/${t.id}/proofs`);
        const with_state = ps.find(p => p.state) || ps.find(
          p => p.kind === "mr" || p.kind === "pr");
        if (with_state) PROOF_STATES[t.id] = with_state.state || "linked";
      } catch { }
    }));
  };
  const render = () => {
    const proj_by = Object.fromEntries(projs.map(p => [p.id, p]));
    const qs_by_proj = {};
    qs.forEach(q => (qs_by_proj[q.project_id] = (qs_by_proj[q.project_id] || 0) + 1));
    const review_ok = t => t.proof_waived || "proof";
    let att = "";
    for (const t of props)
      att += `<div class="row" style="justify-content:space-between">
        <span><a href="#/task/${t.id}">${esc(t.title)}</a>
          ${state_chip("proposed")}
          <span class="dim small">in ${esc((proj_by[t.project_id] || {}).name || "?")}</span></span>
        <button data-approve="${t.id}">approve</button></div>`;
    for (const t of revs)
      att += `<div class="row" style="justify-content:space-between">
        <span><a href="#/task/${t.id}">${esc(t.title)}</a> ${state_chip("review")}
          ${t.proof_waived ? '<span class="tag t-done">waived</span>'
            : `<span class="tag t-building">${PROOF_STATES[t.id] ? esc(PROOF_STATES[t.id]) : "proof?"}</span>`}</span>
        <span><button data-done="${t.id}">mark done</button>
          <button class="ghost" data-goto="${t.id}">open</button></span></div>`;
    if (regs && regs.length)
      att += `<div class="row" style="justify-content:space-between">
        <span><span class="badge">${regs.length}</span> pending registration(s)</span>
        <a href="#/identities">review</a></div>`;
    const by_stack = {};
    projs.filter(p => !p.archived).forEach(p => {
      const key = p.stack_id || 0;
      (by_stack[key] = by_stack[key] || []).push(p);
    });
    const proj_card = p => {
      const open_q = qs_by_proj[p.id] || 0;
      return `<div class="card">
        <div style="font-weight:600"><a href="#/project/${p.id}">${esc(p.name)}</a>
          ${open_q ? `<span class="tag t-proposed" title="open questions">${open_q} q</span>` : ""}
        </div>
        <div class="dim small">${esc((p.description || "").slice(0, 120))}</div>
      </div>`;

      <div style="margin-bottom:18px">
        <div class="row" style="justify-content:space-between">
          <h3 style="margin:0">${esc(s.name)}</h3>
          <span class="dim small mono">${esc(s.slug)}</span></div>

        </div></div>`).join("");
    const loose = (by_stack[0] || []).map(proj_card).join("");

      <section class="card" style="margin-bottom:16px">
        <h3 style="margin-top:0">Needs a human</h3>
        ${att || '<p class="dim">nothing waiting on you</p>'}
      </section>
      <div class="row" style="margin-bottom:14px">
        <button id="np">+ project</button>
        <button class="ghost" id="ns">+ stack</button>
      </div>
      ${stack_html}
      ${loose ? `<h3>No stack</h3><div class="cols">${loose}</div>` : ""}`;
    $("#np").onclick = () => modal_form("New project", [
      { id: "name", label: "name" },
      { id: "slug", label: "slug (optional)" },
      { id: "stack_id", label: "stack", type: "select",
        options: [["", "—"]].concat(stacks.filter(s => !s.archived)
          .map(s => [String(s.id), s.name])) },
      { id: "description", label: "description", type: "textarea" },
    ], "create", async v => {
      await api("POST", "/api/projects", {
        name: v.name, slug: v.slug || undefined,
        stack_id: v.stack_id ? parseInt(v.stack_id, 10) : undefined,
        description: v.description });
      toast("project created"); load();
    });
    $("#ns").onclick = () => modal_form("New stack", [
      { id: "name", label: "name" }, { id: "slug", label: "slug" },
      { id: "description", label: "description", type: "textarea" },
    ], "create", async v => {
      await api("POST", "/api/stacks", v); toast("stack created"); load();
    });
    $$("[data-approve]").forEach(b => b.onclick = async () => {
      try { await api("POST", `/api/tasks/${b.dataset.approve}/transition`,
        { to: "approved", note: "" }); toast("approved"); load(); }
      catch (e) { toast(e.message, true); }
    });
    $$("[data-done]").forEach(b => b.onclick = () => {
      const tid = parseInt(b.dataset.done, 10);
      const t = revs.find(x => x.id === tid);
      if (!t.proof_waived && !confirm("No proof waiver on record — done may require one. Continue?"))
        return;
      modal_form(`Done: ${t.title}`, [
        { id: "note", label: "reason (required when unticked todos remain)", type: "textarea" },
      ], "mark done", async v => {
        await api("POST", `/api/tasks/${tid}/transition`,
          { to: "done", note: v.note, version: t.version });
        toast("done"); load();
      });
    });
    $$("[data-goto]").forEach(b => b.onclick = () =>
      location.hash = "#/task/" + b.dataset.goto);
  };
  try { await load(); render(); } catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(async () => { await load(); render(); });
}

/* ================= Project ================= */
async function view_project(parts) {
  tab_highlight();
  const pid = parseInt(parts[0], 10);
  const main = $("#main");
  main.innerHTML = '<p class="dim">loading…</p>';
  let data, qs, discs, decs, notes;
  const load = async () => {
    data = await api("GET", `/api/projects/${pid}`);
    [qs, discs, decs, notes] = await Promise.all([
      api("GET", `/api/questions?project=${pid}&open=1`),
      api("GET", `/api/projects/${pid}/discussions`),
      api("GET", `/api/projects/${pid}/decisions`),
      api("GET", `/api/projects/${pid}/notes`),
    ]);
  };
  const render = () => {
    const p = data.project, tasks = data.tasks.filter(t => t.state !== "trashed");
    const lanes = ["idea", "plan", "proposed", "approved", "building", "review", "done"];
    const lane_html = lanes.map(st => {
      const cards = tasks.filter(t => t.state === st).map(t => `
        <div class="tcard" data-task="${t.id}">
          <div>${esc(t.title)}</div>
          <div class="small dim">${t.assignee_id ? "· assigned " : ""}${ago(t.state_changed_at)}</div>
        </div>`).join("");
      return `<div class="lane"><h4>${st} (${tasks.filter(t => t.state === st).length})</h4>${cards}</div>`;
    }).join("");
    const q_html = qs.map(q => `
      <div class="comment ${q.status === "open" ? "qopen" : ""}">
        <div class="small dim">#${q.id} · asked ${ago(q.created_at)} · to
          ${esc(q.asked_to_group || q.asked_to_id || "anyone")}</div>
        <div>${md(q.body)}</div>
        ${q.status === "answered" ? `<div class="small"><strong>answer:</strong> ${md(q.answer)}</div>` : ""}
      </div>`).join("");
    const d_html = discs.map(d => `
      <div class="row" style="justify-content:space-between">
        <span>${d.status === "closed" ? "🔒" : ""} <a href="#/discussion/${d.id}?p=${pid}">${esc(d.title)}</a>
          <span class="dim small">${d.kind} · ${d.comment_count || 0}c · ${ago(d.created_at)}</span></span>
      </div>`).join("");
    const dec_html = decs.map(d => `
      <div class="comment">
        <div class="small dim">${state_chip(d.status === "accepted" ? "approved" : d.status === "rejected" || d.status === "superseded" ? "paused" : "proposed")} ${ago(d.created_at)}</div>
        <div style="font-weight:600">${esc(d.title)}</div>
        <div class="small">${esc((d.context || "").slice(0, 160))}</div>
        ${d.outcome ? `<div class="small"><strong>outcome:</strong> ${esc(d.outcome)}</div>` : ""}
      </div>`).join("");
    main.innerHTML = `
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <div><h2 style="margin:0">${esc(p.name)}
            <span class="dim small mono">${esc(p.slug)}</span></h2>
          <div class="dim">${md(p.description)}</div></div>
        <div class="row">
          <button id="pe">edit</button>
          <button id="pt">+ task</button>
          <button id="pd">+ discussion</button>
          <button id="pdec">+ decision</button>
          ${p.archived
            ? `<button id="pa">unarchive</button>`
            : `<button class="bad ghost" id="pa">archive</button>`}
        </div>
      </div>
      ${qs.length ? `<div class="card frozen" style="margin-bottom:12px">
        <strong>${qs.length} open question(s) — project frozen for edits/new tasks</strong>
        ${q_html}</div>` : ""}
      <div class="kanban" style="margin-bottom:18px">${lane_html}</div>
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="card"><h3 style="margin-top:0">Discussions</h3>
          ${d_html || '<p class="dim">none</p>'}</div>
        <div class="card"><h3 style="margin-top:0">Decisions</h3>
          ${dec_html || '<p class="dim">none</p>'}</div>
      </div>
      <div class="card" style="margin-top:12px">
        <h3 style="margin-top:0">Notes</h3>
        <div class="row" style="justify-content:space-between">
          ${(notes || []).map(n => `<a href="#/note/${n.id}">${esc(n.title)}</a>`).join(" · ") || '<span class="dim">none</span>'}
          <button class="ghost" id="pn">+ note</button>
        </div>
      </div>`;
    $$("[data-task]").forEach(el => el.onclick = () =>
      location.hash = "#/task/" + el.dataset.task);
    $("#pe").onclick = () => modal_form("Edit project", [
      { id: "name", label: "name", value: p.name },
      { id: "description", label: "description", type: "textarea", value: p.description },
    ], "save", async v => {
      await api("PATCH", `/api/projects/${pid}`, v); load();
    }, true);
    $("#pt").onclick = () => modal_form("New task", [
      { id: "title", label: "title" },
      { id: "body", label: "body", type: "textarea" },
      { id: "priority", label: "priority", type: "select",
        options: ["medium", "low", "high", "urgent"].map(x => [x, x]) },
      { id: "tags", label: "tags (comma-sep)" },
    ], "create", async v => {
      await api("POST", "/api/tasks", { project_id: pid, ...v }); load();
    }, true);
    $("#pd").onclick = () => modal_form("New discussion", [
      { id: "title", label: "title" },
      { id: "kind", label: "kind", type: "select",
        options: ["info", "question", "proposal", "handover"].map(x => [x, x]) },
      { id: "body", label: "body", type: "textarea" },
    ], "create", async v => {
      await api("POST", `/api/projects/${pid}/discussions`, v); load();
    }, true);
    $("#pdec").onclick = () => modal_form("Propose decision", [
      { id: "title", label: "title" },
      { id: "context", label: "context", type: "textarea" },
    ], "propose", async v => {
      await api("POST", `/api/projects/${pid}/decisions`, v); load();
    }, true);
    $("#pa").onclick = async () => {
      try {
        await api("POST", `/api/projects/${pid}/${p.archived ? "unarchive" : "archive"}`);
        load();
      } catch (e) { toast(e.message, true); }
    };
    $("#pn").onclick = () => modal_form("New note", [
      { id: "title", label: "title" }, { id: "body", label: "body", type: "textarea" },
    ], "create", async v => {
      await api("POST", `/api/projects/${pid}/notes`, v); load();
    }, true);
  };
  try { await load(); render(); } catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(async () => { await load(); render(); });
}
ROUTES.push({ name: "project", view: view_project });


/* identity name directory (display only) */
let IDNAME = {};
async function load_directory() {
  try {
    const rows = await api("GET", "/api/identities/directory");
    IDNAME = Object.fromEntries(rows.map(r => [r.id, r.name]));
  } catch { }
}
const idname = i => esc(IDNAME[i] || ("#" + i));

/* ================= Task detail ================= */
async function view_task(parts) {
  tab_highlight();
  const tid = parseInt(parts[0], 10);
  const main = $("#main");
  main.innerHTML = '<p class="dim">loading…</p>';
  let data, qs, links;
  const load = async () => {
    data = await api("GET", `/api/tasks/${tid}`);
    [qs, links] = await Promise.all([
      api("GET", `/api/questions?attach_type=task&attach_id=${tid}`),
      api("GET", `/api/context?type=task&id=${tid}`),
    ]);
  };
  const render = () => {
    const t = data.task;
    const open_qs = qs.filter(q => q.status === "open");
    const is_human = ME.kind === "human";
    const buttons = (NEXT[t.state] || [])
      .filter(n => is_human || !HUMAN_ONLY(n))
      .map(n => `<button ${n === "trashed" ? 'class="bad ghost"' : ""}
        data-tr="${n}">${n === "previous"
          ? (t.state === "done" ? "not done" : "restore")
          : n}</button>`).join(" ");
    const todo_html = data.todos.map(td => `
      <div class="row" style="justify-content:space-between">
        <label class="row" style="gap:8px">
          <input type="checkbox" class="check" data-tick="${td.id}"
                 ${td.done ? "checked" : ""}>
          <span class="${td.done ? "dim" : ""}">${esc(td.title)}</span></label>
        <button class="ghost small" data-tddel="${td.id}">×</button>
      </div>`).join("");
    const proof_html = data.proofs.length
      ? data.proofs.map(p => `<div class="small">
            ${p.state ? `<span class="tag t-${p.state === "merged" || p.state === "closed" ? "done" : p.state === "open" ? "building" : "paused"}">${esc(p.state)}</span>` : ""}
            <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">
              ${esc(p.kind)}: ${esc(p.url)}</a>
            <span class="dim">${ago(p.added_at)}
              ${p.provider === "other" ? "· unverified" : "· " + esc(p.provider)}</span>
          </div>`).join("")
      : `<span class="dim small">none${t.proof_waived ? " (waived by human)" : ""}</span>`;
    const tr_html = data.transitions.map(tr => `
      <div class="small dim">${ago(tr.created_at)} —
        <span class="st-${esc(tr.to_state || "idea")}">${esc(tr.from_state || "new")}
        → ${esc(tr.to_state)}</span> by ${idname(tr.actor_id)}
        ${tr.note ? `<div class="md">${md(tr.note)}</div>` : ""}</div>`).join("");
    const q_html = qs.map(q => `
      <div class="comment ${q.status === "open" ? "qopen" : ""}">
        <div class="small dim">#${q.id} ${q.status} · ${ago(q.created_at)} ·
          ${idname(q.asked_by)} →
          ${q.asked_to_group ? "group:" + esc(q.asked_to_group) : idname(q.asked_to_id)}</div>
        <div class="md">${md(q.body)}</div>
        ${q.status === "answered"
          ? `<div class="small"><strong>${idname(q.answered_by)}:</strong> ${md(q.answer)}</div>`
          : is_human && q.asked_to_id === ME.id
            ? `<button data-qans="${q.id}">answer</button>` : ""}
      </div>`).join("");
    const link_html = (links || []).map(l => `
      <span class="tag t-idea" data-goto="${esc(l.type)}:${l.id}">${esc(l.type)} #${l.id}
        ${esc(l.title || "")}</span>`).join(" ");
    main.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <div>
          <div class="small dim"><a href="#/project/${t.project_id}">← project</a></div>
          <h2 style="margin:2px 0">${esc(t.title)} ${state_chip(t.state)}</h2>
          <div class="small dim">#${t.id} · v${t.version} · priority ${esc(t.priority)}
            ${t.tags ? "· " + esc(t.tags) : ""} · by ${idname(t.created_by)}
            ${t.assignee_id ? "· assigned to " + idname(t.assignee_id) : ""}
            ${t.state_changed_by ? "· last by " + idname(t.state_changed_by) : ""}</div>
        </div>
        <div class="row">${buttons}</div>
      </div>
      <div class="md" style="margin:10px 0">${md(t.body)}</div>
      ${open_qs.length ? `<div class="card frozen" style="margin:10px 0">
        <strong>Frozen — ${open_qs.length} open question(s)</strong>${q_html}</div>`
        : q_html ? `<div class="card" style="margin:10px 0"><strong>Questions</strong>${q_html}</div>` : ""}
      <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px">
        <div class="card"><h3 style="margin-top:0">Todos</h3>
          ${todo_html || '<p class="dim small">none</p>'}
          <div class="row" style="margin-top:8px">
            <input id="td-new" placeholder="add todo" style="flex:1">
            <button id="td-add">add</button></div></div>
        <div class="card"><h3 style="margin-top:0">Proof</h3>${proof_html}
          <div class="row" style="margin-top:6px">
            <input id="pf-url" placeholder="https://github.com/…/pull/N" style="flex:1">
            <button id="pf-add">attach</button>
            <button class="ghost" id="pf-check">check state</button>
            ${is_human && !t.proof_waived ? `<button class="ghost" id="t-waive">waive</button>` : ""}
          </div></div>
      </div>
      ${link_html ? `<div class="card" style="margin-top:12px"><strong>Context</strong>
        <div class="row">${link_html}</div></div>` : ""}
      <div class="card" style="margin-top:12px"><h3 style="margin-top:0">History</h3>
        ${tr_html || '<p class="dim small">no transitions yet</p>'}</div>
      <div class="row" style="margin-top:12px">
        <button id="t-ask">ask question</button>
        <button id="t-edit">edit task</button>
        ${t.state === "done" || t.state === "trashed"
          ? `<button class="bad ghost" data-tr="previous">${t.state === "done" ? "not done" : "restore"}</button>` : ""}
      </div>`;
    $$("[data-tr]").forEach(b => b.onclick = () => {
      const to = b.dataset.tr;
      if (to === "trashed" && !confirm("Trash this task?")) return;
      const need_note = to === "done" || to === "previous";
      const t_now = data.task;
      modal_form(`Transition → ${to}`, [
        { id: "note", label: HUMAN_NOTE(to), type: "textarea" },
      ], "go", async v => {
        await api("POST", `/api/tasks/${tid}/transition`,
          { to, note: v.note, version: t_now.version });
        toast("→ " + to); await load(); render();
      });
    });
    $$("[data-tick]").forEach(cb => cb.onclick = async () => {
      try {
        const td = data.todos.find(x => x.id === parseInt(cb.dataset.tick, 10));
        await api("POST", `/api/todos/${td.id}/${cb.checked ? "tick" : "untick"}`,
          { version: td.version });
        await load(); render();
      } catch (e) { toast(e.message, true); await load(); render(); }
    });
    $$("[data-tddel]").forEach(b => b.onclick = async () => {
      try { await api("DELETE", `/api/todos/${b.dataset.tddel}`); await load(); render(); }
      catch (e) { toast(e.message, true); }
    });
    $$("[data-qans]").forEach(b => b.onclick = () =>
      modal_form("Answer question", [
        { id: "answer", label: "answer", type: "textarea" },
      ], "answer", async v => {
        await api("POST", `/api/questions/${b.dataset.qans}/answer`, v);
        toast("answered"); await load(); render();
      }));
    $$("[data-goto]").forEach(el => el.onclick = () => {
      const [ty, id] = el.dataset.goto.split(":");
      location.hash = "#/" + (ty === "task" ? "task" : ty === "project"
        ? "project" : ty === "discussion" ? "discussion" : "project") + "/" + id;
    });
    const add_todo = async () => {
      const v = $("#td-new").value.trim();
      if (!v) return;
      try { await api("POST", `/api/tasks/${tid}/todos`, { title: v }); }
      catch (e) { return toast(e.message, true); }
      await load(); render();
    };
    $("#td-add").onclick = add_todo;
    $("#t-ask").onclick = () => modal_form("Ask about this task", [
      { id: "body", label: "question", type: "textarea" },
      { id: "to", label: "to (identity id, blank = anyone)" },
    ], "ask", async v => {
      await api("POST", "/api/questions", {
        project_id: t.project_id, body: v.body, attach_type: "task", attach_id: tid,
        to_identity_id: v.to ? parseInt(v.to, 10) : undefined });
      toast("asked"); await load(); render();
    }, true);
    $("#t-edit").onclick = () => modal_form("Edit task", [
      { id: "title", label: "title", value: t.title },
      { id: "body", label: "body", type: "textarea", value: t.body },
      { id: "priority", label: "priority", type: "select",
        options: ["low", "medium", "high", "urgent"].map(x => [x, x]),
        value: t.priority },
      { id: "tags", label: "tags", value: t.tags },
    ], "save", async v => {
      await api("PATCH", `/api/tasks/${tid}`, { ...v, version: t.version });
      await load(); render();
    }, true);
    $("#pf-add").onclick = async () => {
      const v = $("#pf-url").value.trim();
      if (!v) return;
      try {
        await api("POST", `/api/tasks/${tid}/proofs`, { url: v });
        toast("proof attached"); await load(); render();
      } catch (e) { toast(e.message, true); }
    };
    $("#pf-check").onclick = async () => {
      try {
        const rs = await api("POST", `/api/tasks/${tid}/proofs/check`);
        toast(rs.length ? "state: " + rs.map(x => x.state || "?").join(", ")
          : "nothing checkable / inert");
        await load(); render();
      } catch (e) { toast(e.message, true); }
    };
    const waive = $("#t-waive");
    if (waive) waive.onclick = async () => {
      try {
        await api("PATCH", `/api/tasks/${tid}`,
          { proof_waived: true, version: t.version });
        toast("proof waived"); await load(); render();
      } catch (e) { toast(e.message, true); }
    };
  };
  try { await load(); await load_directory(); render(); }
  catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(async () => { await load(); render(); });
}
ROUTES.push({ name: "task", view: view_task });

/* ================= Discussion ================= */
async function view_discussion(parts) {
  tab_highlight();
  const q = parts[0].split("?");
  const did = parseInt(q[0], 10);
  const pid = new URLSearchParams((q[1] || "")).get("p");
  const main = $("#main");
  let comments, disc = null;
  const load = async () => {
    comments = await api("GET", `/api/discussions/${did}`);
    if (pid) {
      const ds = await api("GET", `/api/projects/${pid}/discussions`);
      disc = ds.find(d => d.id === did) || null;
    }
  };
  const render = () => {
    const html = comments.map(c => `
      <div class="comment ${c.trashed_at ? "trashed" : ""}">
        <div class="small dim">${idname(c.author_id)} · ${ago(c.created_at)}
          ${c.trashed_at ? "· TRASHED" : ""}</div>
        <div class="md">${md(c.body)}</div>
        ${!c.trashed_at && ME.kind === "human"
          ? `<button class="ghost small" data-ctrash="${c.id}">trash</button>` : ""}
      </div>`).join("");
    main.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">${disc ? esc(disc.title) : "Discussion #" + did}
          ${disc && disc.status === "closed" ? "🔒" : ""}</h2>
        <span class="row">
          ${pid ? `<a class="small" href="#/project/${pid}">← project</a>` : ""}
          ${disc && disc.status === "open" && ME.kind === "human"
            ? `<button class="ghost" id="d-close">close</button>` : ""}
        </span></div>
      ${disc ? `<div class="md dim">${md(disc.body)}</div>` : ""}
      <div style="margin:12px 0">${html || '<p class="dim">no comments</p>'}</div>
      <div class="row"><input id="c-new" placeholder="comment" style="flex:1">
        <button class="pri" id="c-add">comment</button></div>`;
    $$("[data-ctrash]").forEach(b => b.onclick = async () => {
      try { await api("POST", `/api/comments/${b.dataset.ctrash}/trash`); load().then(render); }
      catch (e) { toast(e.message, true); }
    });
    const close = $("#d-close");
    if (close) close.onclick = async () => {
      try { await api("POST", `/api/discussions/${did}/close`); load().then(render); }
      catch (e) { toast(e.message, true); }
    };
    $("#c-add").onclick = async () => {
      const v = $("#c-new").value.trim();
      if (!v) return;
      try { await api("POST", `/api/discussions/${did}/comments`, { body: v }); }
      catch (e) { return toast(e.message, true); }
      $("#c-new").value = ""; load().then(render);
    };
  };
  try { await load(); await load_directory(); render(); }
  catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(async () => { await load(); render(); });
}
ROUTES.push({ name: "discussion", view: view_discussion });

/* ================= Note ================= */
async function view_note(parts) {
  tab_highlight();
  const nid = parseInt(parts[0], 10);
  const main = $("#main");
  let data;
  const load = async () => { data = await api("GET", `/api/notes/${nid}`); };
  const render = () => {
    const n = data.note;
    main.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">${esc(n.title)}</h2>
        <button id="n-edit">edit</button></div>
      <div class="small dim">project ${n.project_id} · updated ${ago(n.updated_at)}</div>
      <div class="md card" style="margin:10px 0">${md(n.body)}</div>
      ${data.revisions.length ? `<details><summary class="dim small">
        ${data.revisions.length} revisions</summary>
        ${data.revisions.map(r => `<div class="small dim" style="margin:4px 0">
          ${ago(r.created_at)} — ${esc(r.title)}</div>`).join("")}</details>` : ""}`;
    $("#n-edit").onclick = () => modal_form("Edit note", [
      { id: "title", label: "title", value: n.title },
      { id: "body", label: "body", type: "textarea", value: n.body },
    ], "save", async v => {
      await api("PATCH", `/api/notes/${nid}`, v); await load(); render();
    }, true);
  };
  try { await load(); render(); } catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(async () => { await load(); render(); });
}
ROUTES.push({ name: "note", view: view_note });


/* ================= Identities (admin) ================= */
async function view_identities() {
  tab_highlight();
  const main = $("#main");
  main.innerHTML = '<p class="dim">loading…</p>';
  let regs, ids;
  const load = async () => {
    [regs, ids] = await Promise.all([
      api("GET", "/api/registrations"),
      api("GET", "/api/identities"),
    ]);
  };
  const render = () => {
  const reg_html = regs.map(r => `
    <div class="comment">
      <div><strong>${esc(r.name)}</strong>
        <span class="dim small">· asked ${ago(r.created_at)}</span></div>
      <div class="small">note: ${esc(r.note || "—")}</div>
      <div class="small dim">ip: ${esc(r.ip || "?")} · ua: ${esc((r.user_agent || "").slice(0, 70))}</div>
      <div class="row" style="margin-top:6px">
        <button class="pri" data-approvereg="${r.id}">approve</button>
        <button class="bad ghost" data-rejectreg="${r.id}">reject</button>
      </div>
    </div>`).join("");
  const id_html = ids.map(i => {
    const creds = (i.credentials || []).map(c => `
      <div class="small mono">${esc(c.kind)}${c.label ? "·" + esc(c.label) : ""}
        · ${c.revoked_at ? "revoked" : "active"}
        ${c.last_seen_at ? "· seen " + ago(c.last_seen_at) : "· never seen"}
        ${c.last_ip ? "· " + esc(c.last_ip) : ""}
        · ${c.call_count} calls</div>`).join("");
    return `<tr>
      <td>${esc(i.name)}<div class="small dim">${esc(i.kind)} · ${esc(i.role || "—")}
        · ${esc(i.status)}</div></td>
      <td>${creds || '<span class="dim small">none</span>'}</td>
      <td class="small dim">${i.reg_ip ? esc(i.reg_ip) : ""}
        ${i.reg_user_agent ? "<br>" + esc(i.reg_user_agent.slice(0, 60)) : ""}</td>
      <td class="small dim">${ago(i.created_at)}</td>
      <td class="row">
        ${i.kind === "clanker" && i.status === "active"
          ? `<button data-code="${i.id}">code</button>` : ""}
        ${i.status === "active" && i.id !== ME.id
          ? `<button class="bad ghost" data-revoke="${i.id}">revoke</button>` : ""}
      </td></tr>`;
  }).join("");
  main.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Identities</h2>
      <button id="id-newuser">+ user</button></div>
    <section class="card" style="margin:12px 0">
      <h3 style="margin-top:0">Pending registrations (${regs.length})</h3>
      ${reg_html || '<p class="dim">none</p>'}
    </section>
    <table><thead><tr><th>identity</th><th>credentials</th><th>origin</th>
      <th>created</th><th></th></tr></thead><tbody>${id_html}</tbody></table>`;
  $$("[data-approvereg]").forEach(b => b.onclick = async () => {
    try {
      const r = await api("POST", `/api/registrations/${b.dataset.approvereg}/approve`);
      modal_form("Enrollment code — hand to the clanker", [
        { id: "c", label: "code (expires " + (r.expires_at
          ? new Date(r.expires_at * 1000).toLocaleString() : "?") + ")",
          value: r.code },
      ], "copy", async () => { });
      await load();
    } catch (e) { toast(e.message, true); }
  });
  $$("[data-rejectreg]").forEach(b => b.onclick = async () => {
    if (!confirm("Reject this registration?")) return;
    try {
      await api("POST", `/api/registrations/${b.dataset.rejectreg}/reject`);
      load().then(render);
    }
    catch (e) { toast(e.message, true); }
  });
  $$("[data-code]").forEach(b => b.onclick = async () => {
    try {
      const r = await api("POST", `/api/identities/${b.dataset.code}/code`);
      modal_form("New enrollment code", [{ id: "c", label: "code", value: r.code }],
        "done", async () => { });
    } catch (e) { toast(e.message, true); }
  });
  $$("[data-revoke]").forEach(b => b.onclick = async () => {
    if (!confirm("Revoke this identity and all its credentials?")) return;
    try {
      await api("POST", `/api/identities/${b.dataset.revoke}/revoke`);
      load().then(render);
    }
    catch (e) { toast(e.message, true); }
  });
  $("#id-newuser").onclick = () => modal_form("New user", [
    { id: "username", label: "username" },
    { id: "password", label: "password", type: "password" },
    { id: "role", label: "role", type: "select",
      options: (ME.role === "superadmin"
        ? ["user", "admin", "superadmin"] : ["user", "admin"]).map(x => [x, x]) },
  ], "create", async v => { await api("POST", "/api/users", v); toast("created"); load(); });
  };
  await load();
  render();
  await load_directory();
  return mark_refresh(async () => { await load(); render(); });
}
ROUTES.push({ name: "identities", view: view_identities });

/* ================= Trash ================= */
async function view_trash() {
  tab_highlight();
  const main = $("#main");
  let trashed, archived;
  const load = async () => {
    [trashed, archived] = await Promise.all([
      api("GET", "/api/tasks?state=trashed"),
      api("GET", "/api/projects?archived=1"),
    ]);
  };
  const render = () => {
    const t_html = trashed.map(t => `
      <div class="row" style="justify-content:space-between">
        <span><a href="#/task/${t.id}">${esc(t.title)}</a> ${state_chip("trashed")}
          <span class="dim small">project ${t.project_id} · by ${idname(t.created_by)}</span></span>
        ${ME.kind === "human"
          ? `<button data-restore="${t.id}">restore</button>` : ""}
      </div>`).join("");
    const a_html = archived.filter(p => p.archived).map(p => `
      <div class="row" style="justify-content:space-between">
        <span>${esc(p.name)} <span class="dim small mono">${esc(p.slug)}</span></span>
        <span class="row">
          <button data-unarchive="${p.id}">unarchive</button>
          ${ME.role === "admin" || ME.role === "superadmin"
            ? `<button class="bad ghost" data-purge="${p.id}">purge…</button>` : ""}
        </span></div>`).join("");
    main.innerHTML = `
      <h2 style="margin-top:0">Trash &amp; archive</h2>
      <section class="card" style="margin-bottom:12px"><h3 style="margin-top:0">
        Trashed tasks (${trashed.length})</h3>
        ${t_html || '<p class="dim">none</p>'}</section>
      <section class="card"><h3 style="margin-top:0">Archived projects</h3>
        ${a_html || '<p class="dim">none</p>'}</section>`;
    $$("[data-restore]").forEach(b => b.onclick = async () => {
      try {
        await api("POST", `/api/tasks/${b.dataset.restore}/transition`,
          { to: "previous", note: "restored from trash" });
        toast("restored"); load().then(render);
      } catch (e) { toast(e.message, true); }
    });
    $$("[data-unarchive]").forEach(b => b.onclick = async () => {
      try { await api("POST", `/api/projects/${b.dataset.unarchive}/unarchive`); }
      catch (e) { return toast(e.message, true); }
      load().then(render);
    });
    $$("[data-purge]").forEach(b => b.onclick = () => {
      const pid = b.dataset.purge;
      modal_form("Purge project (permanent, cascades)", [
        { id: "sure", label: 'type "purge" to confirm' },
      ], "purge", async v => {
        if (v.sure !== "purge") throw new Error("not confirmed");
        await api("POST", `/api/projects/${pid}/purge`);
        toast("purged"); load().then(render);
      });
    });
  };
  try { await load(); await load_directory(); render(); }
  catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  return mark_refresh(async () => { await load(); render(); });
}
ROUTES.push({ name: "trash", view: view_trash });

/* ================= Activity (filtered event log) ================= */
const ACT = { project: "", type: "", actor: "", timeframe: "7d", limit: 200 };
async function view_activity() {
  tab_highlight();
  const main = $("#main");
  const render = (events) => {
    const evs = ACT.actor
      ? events.filter(e => String(e.actor_id) === ACT.actor) : events;
    const rows = evs.map(e => `<tr>
      <td class="small dim">${new Date(e.ts * 1000).toLocaleString()}</td>
      <td class="small">${idname(e.actor_id)}</td>
      <td class="mono small">${esc(e.verb)}</td>
      <td class="small">${esc(e.obj_type)} #${e.obj_id}
        ${e.obj_type === "task" ? `<a class="small" href="#/task/${e.obj_id}">→</a>` : ""}
        ${e.obj_type === "project" ? `<a class="small" href="#/project/${e.obj_id}">→</a>` : ""}</td>
      <td class="small dim">${e.project_id || ""}</td>
      <td class="small dim">${esc(e.to_identity_id ? "→ " + idname(e.to_identity_id) : "")}</td>
    </tr>`).join("");
    main.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Activity</h2>
        <span class="dim small mono">${evs.length} shown · tamper-evident log</span></div>
      <div class="card row" style="margin:10px 0">
        <label class="small dim">project</label>
        <select id="a-proj"><option value="">all</option></select>
        <label class="small dim">type</label>
        <select id="a-type">
          <option value="">all</option>
          ${["task", "todo", "project", "question", "decision", "discussion",
             "comment", "note", "wiki", "proof", "identity"].map(x =>
            `<option ${ACT.type === x ? "selected" : ""}>${x}</option>`).join("")}
        </select>
        <label class="small dim">actor</label>
        <select id="a-actor"><option value="">all</option></select>
        <label class="small dim">timeframe</label>
        <select id="a-time">
          ${[["1h", "last hour"], ["24h", "24 hours"], ["7d", "7 days"],
             ["30d", "30 days"], ["all", "all time"]].map(([v, l]) =>
            `<option value="${v}" ${ACT.timeframe === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <button id="a-go">apply</button>
      </div>
      <table><thead><tr><th>when</th><th>who</th><th>verb</th><th>object</th>
        <th>proj</th><th>to</th></tr></thead><tbody>${rows}</tbody></table>`;
    const proj_sel = $("#a-proj"), actor_sel = $("#a-actor");
    api("GET", "/api/projects").then(ps => {
      proj_sel.innerHTML = '<option value="">all</option>' + ps.map(p =>
        `<option value="${p.id}" ${String(ACT.project) === String(p.id) ? "selected" : ""}>
         ${esc(p.name)}</option>`).join("");
    });
    actor_sel.innerHTML = '<option value="">all</option>' +
      Object.entries(IDNAME).map(([id, name]) =>
        `<option value="${id}" ${ACT.actor === id ? "selected" : ""}>${esc(name)}</option>`).join("");
    $("#a-go").onclick = () => {
      ACT.project = proj_sel.value; ACT.type = $("#a-type").value;
      ACT.actor = actor_sel.value; ACT.timeframe = $("#a-time").value;
      refresh();
    };
  };
  const refresh = async () => {
    try {
      // `since` on /api/events is an event-ID cursor, not a timestamp —
      // timeframes filter client-side on ts after fetching the tail.
      const hours = { "1h": 1, "24h": 24, "7d": 168, "30d": 720, "all": 0 };
      const cutoff = hours[ACT.timeframe]
        ? Date.now() / 1000 - hours[ACT.timeframe] * 3600 : 0;
      let q = `/api/events?desc=1&limit=${ACT.limit}`;
      if (ACT.project) q += `&project=${ACT.project}`;
      if (ACT.type) q += `&type=${ACT.type}`;
      let evs = await api("GET", q);
      if (cutoff) evs = evs.filter(e => e.ts >= cutoff);
      render(evs);
    } catch (e) { main.innerHTML = `<p>${esc(e.message)}</p>`; }
  };
  await load_directory();
  await refresh();
  return mark_refresh(refresh);
}
ROUTES.push({ name: "activity", view: view_activity });

if (TOKEN) boot(); else render_auth();
