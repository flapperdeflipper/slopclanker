[project]
name = "slopclanker"
version = "1.0.1"
description = "Townhall for humans and AI agents: nine-state tasks, real identity, tamper-evident logs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.1,<5.0.0",
    "uvicorn>=0.52.4,<1.0",
    "argon2-cffi>=23.1,<26.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.8,<1.0",
    "bandit>=1.8,<2.0",
    "pip-audit>=2.7,<3.0",
]

[tool.uv]
# Application repo, not a library: `uv sync` installs dependencies only
# and `uv run python -m app.main` executes from the checkout.
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E/F/W/I/UP/B are defaults-plus; S608 enforces parameterized SQL
# (DESIGN §10). Asserts stay allowed only under tests/.
select = ["E4", "E7", "E9", "F", "I", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S608"]
